        for (let i = 0; i < 64; i++) {
          const a = i / 64 * Math.PI * 2;
          ctx.fillStyle = i % 2 ? '#fff3b0' : '#ff5a1f';
          ctx.fillRect(Math.round(fx.x + Math.cos(a) * R), Math.round(fx.y + Math.sin(a) * R), 2, 2);
        }
      } else if (fx.kind === 'bolt') {
        ctx.globalAlpha = 1 - k;
        for (const [off, col] of [[1, '#6f8ff5'], [-1, '#6f8ff5'], [0, '#ffffff']]) {
          ctx.fillStyle = col;
          for (let i = 0; i < fx.pts.length - 1; i++) {
            pixLine(fx.pts[i].x + off, fx.pts[i].y, fx.pts[i + 1].x + off, fx.pts[i + 1].y);
          }
        }
        ctx.fillStyle = '#ffe14d';
        for (let i = 0; i < fx.pts.length - 1; i++) pixLine(fx.pts[i].x, fx.pts[i].y + 1, fx.pts[i + 1].x, fx.pts[i + 1].y + 1);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Iron chains: from a wall anchor to the Chained Ball (held) or to a caught enemy (locked).
  function drawChains() {
    for (const c of chains) {
      const end = c.target || c.owner;
      if (!end.alive) continue;
      const dx = end.x - c.ax, dy = end.y - c.ay, d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      const locked = !!c.target;
      // links alternate: a flat ring (two rails) then one seen edge-on (a single bar)
      const steel = locked ? '#e4e8ee' : '#a4abb6', shade = locked ? '#8a929e' : '#5f6670';
      for (let s2 = 0, k = 0; s2 < d - end.r + 2; s2 += 4, k++) {
        const x = c.ax + ux * s2, y = c.ay + uy * s2;
        const x2 = x + ux * 4, y2 = y + uy * 4;
        if (k % 2 === 0) {
          ctx.fillStyle = steel;
          pixLine(x - uy * 1.5, y + ux * 1.5, x2 - uy * 1.5, y2 + ux * 1.5);
          ctx.fillStyle = shade;
          pixLine(x + uy * 1.5, y - ux * 1.5, x2 + uy * 1.5, y2 - ux * 1.5);
        } else {
          ctx.fillStyle = shade;
          pixLine(x + uy * 0.6, y - ux * 0.6, x2 + uy * 0.6, y2 - ux * 0.6);
          ctx.fillStyle = steel;
          pixLine(x, y, x2, y2);
        }
      }
      // anchor bolt on the wall
      ctx.fillStyle = '#221c14'; ctx.fillRect(Math.round(c.ax) - 2, Math.round(c.ay) - 2, 5, 5);
      ctx.fillStyle = locked ? '#ffe14d' : '#c9ced6'; ctx.fillRect(Math.round(c.ax) - 1, Math.round(c.ay) - 1, 3, 3);
      // shackle around a caught ball
      if (locked) {
        ctx.fillStyle = '#c9ced6';
        for (let i = 0; i < 16; i++) {
          if (i % 4 === 3) continue;
          const a = i / 16 * Math.PI * 2;
          ctx.fillRect(Math.round(end.x + Math.cos(a) * (end.r + 1)), Math.round(end.y + Math.sin(a) * (end.r + 1)), 1, 1);
        }
      }
    }
  }

  // Heal pickups: a glowing green cross that bobs and blinks before it fades out.
  function drawHeals() {
    for (const h of heals) {
      const cfg = h.owner.type.healer;
      const left = cfg.life - h.t;
      if (left < 2 && Math.floor(performance.now() / 100) % 2) continue;   // blink when about to vanish
      const pop = Math.min(1, h.t / 0.2);
      const y = Math.round(h.y + Math.sin(performance.now() / 250 + h.x) * 1.5);
      const x = Math.round(h.x);
      ctx.globalAlpha = 0.25 * pop;
      ctx.fillStyle = '#8af5a0';
      for (let dy = -6; dy <= 6; dy++) {
        const w2 = Math.floor(Math.sqrt(36 - dy * dy));
        ctx.fillRect(x - w2, y + dy, w2 * 2 + 1, 1);
      }
      ctx.globalAlpha = 1;
      const a = Math.round(3 * pop), bw = Math.max(1, Math.round(pop));
      ctx.fillStyle = '#14501c';
      ctx.fillRect(x - a - 1, y - bw - 1, a * 2 + 3, bw * 2 + 3); ctx.fillRect(x - bw - 1, y - a - 1, bw * 2 + 3, a * 2 + 3);
      ctx.fillStyle = '#5ee07a';
      ctx.fillRect(x - a, y - bw, a * 2 + 1, bw * 2 + 1); ctx.fillRect(x - bw, y - a, bw * 2 + 1, a * 2 + 1);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - bw, y - a, 1, 1);
    }
  }

  // Mini bombs: a small bomb with a lit fuse, and a blinking ring showing its huge blast.
  function drawMiniBombs() {
    for (const mb of miniBombs) {
      const m = mb.owner.type.bomb.mini;
      const blink = Math.floor(performance.now() / (mb.fuse < 0.7 ? 60 : 160)) % 2 === 0;
      // warning ring
      ctx.globalAlpha = blink ? 0.9 : 0.45;
      ctx.fillStyle = '#ff7a3d';
      const dots = 160;
      for (let i = 0; i < dots; i++) {
        if (i % 4 === 3) continue;   // dashed
        const a = i / dots * Math.PI * 2;
        ctx.fillRect(Math.round(mb.x + Math.cos(a) * m.radius), Math.round(mb.y + Math.sin(a) * m.radius), 1, 1);
      }
      // the danger zone fills in as the fuse burns down
      const k = 1 - mb.fuse / m.fuse;
      const R = m.radius * k;
      ctx.globalAlpha = 0.08 + 0.1 * k;
      for (let dy = -R; dy <= R; dy++) {
        const w = Math.floor(Math.sqrt(R * R - dy * dy));
        ctx.fillRect(Math.round(mb.x - w), Math.round(mb.y + dy), w * 2 + 1, 1);
      }
      ctx.globalAlpha = 1;
      // the bomb itself, popping in when it lands
      const r = Math.round(5 * Math.min(1, mb.t / 0.12));
      if (r <= 0) continue;
      // orange outline so it stands out on the dark floor
      ctx.fillStyle = blink ? '#ff7a3d' : '#b5502a';
      for (let dy = -r - 1; dy <= r + 1; dy++) {
        const w = Math.floor(Math.sqrt((r + 1) * (r + 1) - dy * dy));
        ctx.fillRect(Math.round(mb.x - w), Math.round(mb.y + dy), w * 2 + 1, 1);
      }
      for (let dy = -r; dy <= r; dy++) {
        const w = Math.floor(Math.sqrt(r * r - dy * dy));
        ctx.fillStyle = '#2b2f3a';
        ctx.fillRect(Math.round(mb.x - w), Math.round(mb.y + dy), w * 2 + 1, 1);
      }
      ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(mb.x - 2), Math.round(mb.y - 3), 1, 1);
      ctx.fillStyle = '#5a6070'; ctx.fillRect(Math.round(mb.x - 2), Math.round(mb.y - 3), 2, 1);
      ctx.fillStyle = '#c9a36b'; pixLine(mb.x, mb.y - r, mb.x + 2, mb.y - r - 3);
      if (blink) { ctx.fillStyle = '#fff3b0'; ctx.fillRect(Math.round(mb.x + 2), Math.round(mb.y - r - 4), 2, 2); }
    }
  }

  // Bomb fuse with a flickering spark; it flickers faster as it burns down.
  function drawFuse(x, y, r, fuseLeft) {
    ctx.fillStyle = '#c9a36b';
    pixLine(x, y - r - 1, x + 2, y - r - 4);
    pixLine(x + 2, y - r - 4, x + 5, y - r - 5);
    const rate = fuseLeft < 1 ? 40 : 120;
    if (Math.floor(performance.now() / rate) % 2 === 0) {
      ctx.fillStyle = '#fff3b0'; ctx.fillRect(Math.round(x + 5), Math.round(y - r - 6), 2, 2);
      ctx.fillStyle = '#ff8a3d'; ctx.fillRect(Math.round(x + 6), Math.round(y - r - 7), 1, 1);
      ctx.fillRect(Math.round(x + 4), Math.round(y - r - 7), 1, 1);
    }
  }

  // Frost tint on a chilled ball.
  function drawChill(b) {
    if (!b.alive || b.chill <= 0) return;
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#9fe3f5';
    for (let dy = -b.r; dy <= b.r; dy++) {
      const w = Math.floor(Math.sqrt(b.r * b.r - dy * dy));
      ctx.fillRect(Math.round(b.x - w), Math.round(b.y + dy), w * 2 + 1, 1);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + performance.now() / 900;
      ctx.fillRect(Math.round(b.x + Math.cos(a) * (b.r + 2)), Math.round(b.y + Math.sin(a) * (b.r + 2)), 1, 1);
    }
  }

  // Shimmering hex-dotted bubble around a shielded ball.
  function drawShield(b) {
    if (!b.alive || !b.shielded) return;
    const R = b.r + 4;
    const pulse = 0.8 + Math.sin(performance.now() / 180) * 0.2;
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * Math.PI * 2;
      ctx.globalAlpha = pulse * (i % 4 === 0 ? 1 : 0.6);
      ctx.fillStyle = i % 4 === 0 ? '#ffffff' : '#7fc8ff';
      ctx.fillRect(Math.round(b.x + Math.cos(a) * R), Math.round(b.y + Math.sin(a) * R), 1, 1);
    }
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#7fc8ff';
    for (let dy = -R; dy <= R; dy++) {
      const w = Math.floor(Math.sqrt(R * R - dy * dy));
      ctx.fillRect(Math.round(b.x - w), Math.round(b.y + dy), w * 2 + 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  // Jagged electric arcs in a ring around a ball.
  function drawArcs(x, y, R, count, colors) {
    for (let k = 0; k < count; k++) {
      const a0 = Math.random() * Math.PI * 2;
      let px = x + Math.cos(a0) * R, py = y + Math.sin(a0) * R;
      ctx.fillStyle = colors[k % colors.length];
      for (let s2 = 1; s2 <= 3; s2++) {
        const a = a0 + s2 * 0.22;
        const rr = R + (Math.random() - 0.5) * 5;
        const nx = x + Math.cos(a) * rr, ny = y + Math.sin(a) * rr;
        pixLine(px, py, nx, ny);
        px = nx; py = ny;
      }
    }
  }

  // A stunned ball crackles with electricity, with a countdown bar under it.
  function drawWrap(b) {
    if (!b.alive || b.stuck <= 0) return;
    drawArcs(b.x, b.y, b.r + 2, 4, ['#ffe14d', '#7fd8ff', '#ffffff']);
    // dizzy stars circling overhead
    for (let i = 0; i < 3; i++) {
      const a = performance.now() / 200 + i * Math.PI * 2 / 3;
      ctx.fillStyle = '#ffe14d';
      ctx.fillRect(Math.round(b.x + Math.cos(a) * 8), Math.round(b.y - b.r - 4 + Math.sin(a) * 2), 2, 2);
    }
    const max = 1.5;
    const w = Math.round((b.r * 2) * Math.min(1, b.stuck / max));
    ctx.fillStyle = '#0a1020'; ctx.fillRect(Math.round(b.x - b.r) - 1, Math.round(b.y + b.r + 2), b.r * 2 + 2, 3);
    ctx.fillStyle = '#7fd8ff'; ctx.fillRect(Math.round(b.x - b.r), Math.round(b.y + b.r + 3), w, 1);
  }

  // Blue electric aura around a charged shocker; sparks just before it charges.
  function drawCharge(b) {
    if (!b.alive || !b.type.shocker) return;
    if (b.charged > 0) {
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#7fd8ff';
      const R = b.r + 5;
      for (let dy = -R; dy <= R; dy++) {
        const w = Math.floor(Math.sqrt(R * R - dy * dy));
        ctx.fillRect(Math.round(b.x - w), Math.round(b.y + dy), w * 2 + 1, 1);
      }
      ctx.globalAlpha = 1;
      drawArcs(b.x, b.y, b.r + 4, 6, ['#7fd8ff', '#ffffff', '#3d8fe0']);
    } else if (b.shockT < 0.5) {
      ctx.fillStyle = '#7fd8ff';
      for (let i = 0; i < 3; i++) {
        const a = Math.random() * Math.PI * 2;
        ctx.fillRect(Math.round(b.x + Math.cos(a) * (b.r + 2)), Math.round(b.y + Math.sin(a) * (b.r + 2)), 1, 1);
      }
    }
  }

  function drawAxe(x, y, angle, alpha = 1, scale = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(Math.round(x), Math.round(y));
    ctx.rotate(angle);
    ctx.scale(scale, scale);
    ctx.drawImage(axeSprite, 0, -Math.round(AXE_PIVOT_Y));
    ctx.restore();
  }

  function drawWeapon(b) {
    if (b.type.cap && b.alive) drawFuse(b.x, b.y, b.r, b.fuse);
    if (b.type.zap && b.alive && b.zapT < 0.6) {
      // crackling sparks while the next strike charges
      ctx.fillStyle = '#ffe14d';
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * Math.PI * 2;
        ctx.fillRect(Math.round(b.x + Math.cos(a) * (b.r + 2)), Math.round(b.y + Math.sin(a) * (b.r + 2)), 1, 1);
      }
    }
    if (b.type.studs && b.alive) drawStuds(b.x, b.y, b.r, performance.now() / 600);
    if (b.type.fangs && b.alive) drawFangs(b.x, b.y, b.r, b.face, !!b.latch);
    if (b.type.legs && b.alive) {
      const moving = b.stuck > 0 ? 0 : Math.hypot(b.vx, b.vy);
      drawLegs(b.x, b.y, b.r, performance.now() / 1000 * (4 + moving * 0.12));
    }
    if (!b.type.weapon || !b.alive) return;
    const speed = Math.abs(b.spin);
    // swoosh trail behind the blade once it gets going
    if (speed > 5) {
      const len = Math.min(2.6, speed * 0.09);
      const dir = Math.sign(b.spin);
      const reach = Math.hypot(AXE_BLADE.x + 4, AXE_BLADE.y);
      const base = b.angle + Math.atan2(AXE_BLADE.y - 3, AXE_BLADE.x + 4);
      for (let i = 0; i < 40; i++) {
        const t = i / 40;
        const a = base + dir * t * len;
        ctx.globalAlpha = (1 - t) * 0.55;
        ctx.fillStyle = speed > 14 ? '#ffd27a' : '#e8f1ff';
        for (let k = 0; k < 3; k++) {
          const rr = reach - k * 3;
          ctx.fillRect(Math.round(b.x + Math.cos(a) * rr), Math.round(b.y + Math.sin(a) * rr), 1, 1);
        }
      }
      ctx.globalAlpha = 1;
      // ghost axe a little behind the real one
      drawAxe(b.x, b.y, b.angle + Math.sign(b.spin) * Math.min(0.5, speed * 0.02), 0.25);
    }
    drawAxe(b.x, b.y, b.angle);
  }

  function drawBall(b) {
    if (!b.alive) return;
    const spr = b.type.sprite;
    const wobble = b.type.slime ? Math.sin(performance.now() / 120 + b.x * 0.1) * 0.06 : 0;   // slimes jiggle
    const s = 1 + b.squash * 1.2 + wobble;
    const k = b.r / b.type.radius;   // split slimes are smaller
    const w = Math.round(spr.width * s * k), h = Math.round(spr.height / s * k);
    const x = Math.round(b.x - w / 2), y = Math.round(b.y - h / 2);
    // ground shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(Math.round(b.x - b.r + 2), Math.round(b.y + b.r - 1), b.r * 2 - 2, 2);
    ctx.drawImage(spr, x, y, w, h);
    if (b.type.fangs) drawVampEyes(b.x, b.y, b.r, b.face);
    // side marker ring dot
    ctx.fillStyle = SIDES[b.side].color;
    ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y - b.r - 3), 3, 2);
    // HP number in the middle of the ball
    drawTextCentered(Math.ceil(b.hp), b.x + 1, Math.round(b.y) - 2, '#ffffff', 1, '#1a2233');
    if (b.type.rng) drawRngBadge(b);
  }

  // The rolled number, in a little gold-trimmed box above the ball.
  function drawRngBadge(b) {
    const spinning = b.rngSpin > 0;
    const shown = spinning ? randInt(b.type.rng.min, b.type.rng.max) : b.rngValue;
    const bx = Math.round(b.x) - 7, by = Math.round(b.y - b.r) - 14;
    ctx.fillStyle = '#0a1020'; ctx.fillRect(bx - 1, by - 1, 16, 11);
    ctx.fillStyle = spinning ? '#ffffff' : '#d9a520'; ctx.fillRect(bx, by, 14, 9);
    ctx.fillStyle = '#1a1430'; ctx.fillRect(bx + 1, by + 1, 12, 7);
    drawTextCentered(shown, bx + 7.5, by + 2, spinning ? '#ffffff' : rngColor(shown), 1, null);
  }

  // Flash tint needs its own buffer so it only tints the ball.
  const tintBuf = document.createElement('canvas');
  const tctx = tintBuf.getContext('2d');
  function drawBallWithFlash(b) {
    if (!b.alive) return;
    if (b.phased) {
      // a faded ghost is see-through
      ctx.save();
      ctx.globalAlpha = 0.3 + Math.sin(performance.now() / 120) * 0.08;
      drawBall(b);
      ctx.restore();
      return;
    }
    if (b.flash <= 0) return drawBall(b);
    const spr = b.type.sprite;
    tintBuf.width = spr.width; tintBuf.height = spr.height;
    tctx.drawImage(spr, 0, 0);
    tctx.globalCompositeOperation = 'source-atop';
    tctx.fillStyle = 'rgba(255,70,70,0.75)';
    tctx.fillRect(0, 0, spr.width, spr.height);
    tctx.globalCompositeOperation = 'source-over';
    const original = b.type.sprite;
    b.type.sprite = tintBuf;
    const f = b.flash; b.flash = 0;
    drawBall(b);
    b.flash = f;
    b.type.sprite = original;
  }

  function drawPanel(ball, x, alignRight) {
    const side = SIDES[ball.side];
    const t = ball.type;
    const nameX = alignRight ? x - textWidth(side.label) : x;
    drawText(side.label, nameX, 8, side.color);
    // ball icon (with its weapon)
    const ix = alignRight ? x - t.sprite.width : x;
    if (t.weapon) {
      const icx = ix + t.radius, icy = 16 + t.radius;
      drawAxe(icx, icy, alignRight ? Math.PI + 0.25 : -0.25);
    }
    if (t.legs) drawLegs(ix + t.radius, 16 + t.radius, t.radius, performance.now() / 250);
    if (t.studs) drawStuds(ix + t.radius, 16 + t.radius, t.radius, performance.now() / 600);
    const iconFace = alignRight ? Math.PI : 0;
    if (t.fangs) drawFangs(ix + t.radius, 16 + t.radius, t.radius, iconFace, false);
    if (t.cap) drawFuse(ix + t.radius, 16 + t.radius, t.radius, 9);
    ctx.drawImage(t.sprite, ix, 16);
    if (t.fangs) drawVampEyes(ix + t.radius, 16 + t.radius, t.radius, iconFace);
    // ball name
    const lbl = t.name;
    drawText(lbl, alignRight ? x - textWidth(lbl) : x, 44, '#ffffff');
    // hp bar
    const bw = 60, bx = alignRight ? x - bw : x, by = 52;
    ctx.fillStyle = '#0a1020'; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    ctx.fillStyle = '#3a2030'; ctx.fillRect(bx, by, bw, 4);
    const pct = ball.hp / ball.maxHp;
    ctx.fillStyle = pct > 0.5 ? '#5ee07a' : pct > 0.25 ? '#ffd23f' : '#ff4f4f';
    ctx.fillRect(bx, by, Math.round(bw * pct), 4);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(bx, by, Math.round(bw * pct), 1);
    // a tank marks where its shield comes up
    if (t.shield && !ball.shielded) {
      const sx = bx + Math.round(bw * t.shield.at / ball.maxHp);
      ctx.fillStyle = '#7fc8ff'; ctx.fillRect(sx, by - 2, 1, 8);
    }
    // facing an Execute Ball: mark the kill line on this bar
    const foe = foeOf(ball) || balls.find(o => o.side !== ball.side);
    if (foe && foe.type.execute) {
      const tx = bx + Math.round(bw * foe.type.execute.below);
      ctx.fillStyle = '#d6a8ff'; ctx.fillRect(tx, by - 2, 1, 8);
    }
    const hpText = Math.ceil(ball.hp) + '/' + ball.maxHp;
    drawText(hpText, alignRight ? x - textWidth(hpText) : x, 59, '#cfe0ff');
    if (t.weapon) {
      const mult = 'AXE SPEED X' + (Math.abs(ball.spin) / t.weapon.spinStart).toFixed(1);
      drawText(mult, alignRight ? x - textWidth(mult) : x, 67, '#ffb03b');
    }
    let line = 67;
    if (t.weapon) line += 8;
    if (t.spikes) {
      const n = spikes.filter(sp => sp.owner === ball).length;
      const txt = 'SPIKES ' + n + '/' + t.spikes.max;
      drawText(txt, alignRight ? x - textWidth(txt) : x, line, '#e4e8ee');
      line += 8;
    }
    const info = [];
    if (t.bomb) {
      info.push(['BOOM IN ' + Math.max(0, ball.fuse).toFixed(1) + 'S', ball.fuse < 1 ? '#ff5a1f' : '#ffb03b']);
      info.push(['MINI BOMBS ' + miniBombs.filter(mb => mb.owner === ball).length + '/' + t.bomb.mini.max, '#ffb03b']);
    }
    if (t.ghost) info.push([(ball.phased ? 'FADED ' : 'SOLID ') + Math.max(0, ball.phaseT).toFixed(1) + 'S', ball.phased ? '#ffffff' : '#b9b0d6']);
    if (t.zap) info.push(['ZAP IN ' + Math.max(0, ball.zapT).toFixed(1) + 'S', '#ffe14d']);
    if (t.slime) {
      const n = balls.filter(b => b.side === ball.side && b.alive).length;
      info.push(['SLIMES ' + n + '  SPLIT ' + (ball.gen < t.slime.splitBelow.length ? 'UNDER ' + t.slime.splitBelow[ball.gen] : 'DONE'), '#c6f9a8']);
    }
    if (t.healer) info.push(['HEALS ' + heals.filter(h => h.owner === ball).length + '/' + t.healer.max, '#5ee07a']);
    if (t.chains) {
      const mine = chains.filter(c => c.owner === ball);
      info.push(['CHAINS ' + mine.length + '/' + t.chains.max + ' (' + mine.filter(c => c.target).length + ' ON)', '#c9ced6']);
      if (ball.chainT > 0) info.push(['LOCKED ' + ball.chainT.toFixed(1) + 'S', '#ffe14d']);
    }
    if (t.shocker) info.push(ball.charged > 0 ? ['CHARGED ' + ball.charged.toFixed(1) + 'S', '#ffffff'] : ['CHARGE IN ' + Math.max(0, ball.shockT).toFixed(1) + 'S', '#7fd8ff']);
    if (ball.chill > 0) info.push(['SLOWED ' + ball.chill.toFixed(1) + 'S', '#9fe3f5']);
    for (const [txt, col] of info) {
      drawText(txt, alignRight ? x - textWidth(txt) : x, line, col);
      line += 8;
    }
    if (t.vampire) {
      const txt = ball.latch ? 'DRAINING ' + Math.max(0, ball.latch.t).toFixed(1) + 'S'
        : ball.latchCd > 0 ? 'BITE IN ' + ball.latchCd.toFixed(1) + 'S' : 'BITE READY';
      drawText(txt, alignRight ? x - textWidth(txt) : x, line, ball.latch ? '#ff4f6d' : '#d9a0b4');
      line += 8;
    }
    if (t.shield) {
      const txt = ball.shielded ? 'SHIELD -' + Math.round(t.shield.reduction * 100) + '% DMG' : 'SHIELD AT ' + t.shield.at + ' HP';
      drawText(txt, alignRight ? x - textWidth(txt) : x, line, ball.shielded ? '#7fc8ff' : '#9fb6dc');
      line += 8;
      if (ball.shielded && t.shield.damageBoost) {
        const hit = 'HIT ' + Math.round(t.damage * (1 + t.shield.damageBoost)) + ' +' + Math.round(t.shield.damageBoost * 100) + '%';
        drawText(hit, alignRight ? x - textWidth(hit) : x, line, '#ff8a8a');
        line += 8;
      }
    }
    if (t.execute) {
      const txt = 'EXECUTE <' + Math.round(t.execute.below * 100) + '%';
      drawText(txt, alignRight ? x - textWidth(txt) : x, line, '#d6a8ff');
      line += 8;
    }
    if (t.rng) {
      const txt = ball.rngSpin > 0 ? 'ROLLING ' + ball.rngSpin.toFixed(1) + 'S' : 'NEXT HIT ' + ball.rngValue;
      drawText(txt, alignRight ? x - textWidth(txt) : x, line, ball.rngSpin > 0 ? '#ffffff' : rngColor(ball.rngValue));
      line += 8;
    }
    if (t.web) {
      const mine = webs ? webs.filter(wb => wb.owner === ball).length : 0;
      const webText = 'WEBS ' + mine + '/' + t.web.max + (ball.strand ? ' +SPINNING' : '');
      drawText(webText, alignRight ? x - textWidth(webText) : x, line, '#e6e9f2');
      line += 8;
    }
    const speed = ball.stuck > 0 ? 'STUNNED ' + ball.stuck.toFixed(1) + 'S'
      : 'SPEED X' + (Math.hypot(ball.vx, ball.vy) / t.speed).toFixed(1);
    drawText(speed, alignRight ? x - textWidth(speed) : x, line, ball.stuck > 0 ? '#ffffff' : '#9fe6ff');
    if (state === 'aim') {
      const hint = alignRight && cpuRandom ? 'RANDOM - CLICK' : 'CLICK TO CHANGE';
      drawText(hint, alignRight ? x - textWidth(hint) : x, 94, '#9fb6dc');
    }
  }

  function drawAimArrow() {
    const me = balls[0];
    let dx = aim.x - me.x, dy = aim.y - me.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = dx / len, ny = dy / len;
    const power = aimPower();
    const start = me.r + 4, end = me.r + 10 + Math.round(power * 26);
    ctx.fillStyle = power > 1.2 ? '#ffb03b' : '#ffffff';
    // dashed shaft
    for (let d = start; d < end - 6; d += 1) {
      if (Math.floor((d - start) / 4) % 2 === 1) continue;
      const px = Math.round(me.x + nx * d), py = Math.round(me.y + ny * d);
      ctx.fillRect(px - 1, py - 1, 2, 2);
    }
    // arrow head
    const tipX = me.x + nx * end, tipY = me.y + ny * end;
    for (let i = 0; i < 8; i++) {
      const bx = tipX - nx * i, by = tipY - ny * i;
      const half = i * 0.6;
      for (let s = -half; s <= half; s += 0.5) {
        ctx.fillRect(Math.round(bx - ny * s), Math.round(by + nx * s), 1, 1);
      }
    }
  }

  // One short line describing a ball's special, for its card.
  function abilityText(t) {
    if (t.weapon) return ['AXE ' + t.weapon.damage, '#ffb03b'];
    if (t.web) return ['WEB DMG ' + t.web.damage, '#e6e9f2'];
    if (t.shield) return ['SHLD ' + Math.round(t.shield.reduction * 100) + '%', '#7fc8ff'];
    if (t.execute) return ['KILL <' + Math.round(t.execute.below * 100) + '%', '#d6a8ff'];
    if (t.rng) return ['ROLL ' + t.rng.spinTime + 'S', '#9fb6dc'];
    if (t.spikes) return ['SPIKE ' + t.spikes.medium.damage + '-' + t.spikes.big.damage, '#e4e8ee'];
    if (t.vampire) return ['DRAIN ' + (t.vampire.drain / t.vampire.tickEvery) + '/S', '#ff4f6d'];
    if (t.bomb) return ['BOOM ' + t.bomb.damage, '#ffb03b'];
    if (t.ghost) return ['FADE ' + t.ghost.faded + 'S', '#e6e0f5'];
    if (t.zap) return ['ZAP ' + t.zap.damage + '/' + t.zap.every + 'S', '#ffe14d'];
    if (t.freeze) return ['SLOW ' + t.freeze.time + 'S', '#9fe3f5'];
    if (t.shocker) return ['STUN ' + t.shocker.stun + 'S', '#7fd8ff'];
    if (t.chains) return ['CHAIN ' + t.chains.hold + 'S', '#c9ced6'];
    if (t.slime) return ['SPLITS X2', '#c6f9a8'];
    if (t.healer) return ['HEAL ' + t.healer.heal, '#5ee07a'];
    return ['', '#ffffff'];
  }

  // Tiny 5x5 icons for the compact cards.
  const HEART_ICON = ['01010', '11111', '11111', '01110', '00100'];
  const SWORD_ICON = ['00001', '00010', '10100', '01000', '10100'];
  function drawIcon(rows, x, y, color) {
    ctx.fillStyle = color;
    rows.forEach((row, ry) => [...row].forEach((ch, rx) => { if (ch === '1') ctx.fillRect(x + rx, y + ry, 1, 1); }));
  }

  function drawSelect() {
    // the pick screen covers the whole view
    ctx.fillStyle = 'rgba(8,14,30,0.82)';
    ctx.fillRect(6, 12, W - 12, H - 18);
    ctx.fillStyle = '#30487a';
    ctx.fillRect(6, 12, W - 12, 1); ctx.fillRect(6, H - 7, W - 12, 1);
    if (selectStep === 0) {
      drawTextCentered('CHOOSE YOUR BALL', W / 2, 18, SIDES[0].color, 1);
      drawTextCentered('THEN PICK THE CPU BALL', W / 2, 26, '#9fb6dc', 1);
    } else {
      drawTextCentered('CHOOSE THE CPU BALL', W / 2, 18, SIDES[1].color, 1);
      drawTextCentered('YOU: ' + BALL_TYPES[picks[0]].short + '   ESC: BACK', W / 2, 26, '#9fb6dc', 1);
    }
    cardRects().forEach((c, i) => {
      const t = BALL_TYPES[c.key];
      const hot = i === hoverCard;
      const mine = selectStep === 1 && c.key === picks[0];   // your ball, for reference
      const lift = hot ? -2 : 0;
      const y = c.y + lift;
      // card body
      ctx.fillStyle = '#0a1020'; ctx.fillRect(c.x - 1, y - 1, c.w + 2, c.h + 2);
      ctx.fillStyle = hot ? '#2f4a7a' : '#22345a'; ctx.fillRect(c.x, y, c.w, c.h);
      ctx.fillStyle = hot ? '#4f72b0' : '#30487a'; ctx.fillRect(c.x, y, c.w, 2);
      if (hot) {
        ctx.fillStyle = '#ffd23f';
        ctx.fillRect(c.x - 1, y - 1, c.w + 2, 1); ctx.fillRect(c.x - 1, y + c.h, c.w + 2, 1);
        ctx.fillRect(c.x - 1, y - 1, 1, c.h + 2); ctx.fillRect(c.x + c.w, y - 1, 1, c.h + 2);
      }
      if (mine && !hot) {
        ctx.fillStyle = SIDES[0].color;
        ctx.fillRect(c.x - 1, y - 1, c.w + 2, 1); ctx.fillRect(c.x - 1, y + c.h, c.w + 2, 1);
        ctx.fillRect(c.x - 1, y - 1, 1, c.h + 2); ctx.fillRect(c.x + c.w, y - 1, 1, c.h + 2);
      }
      if (c.key === RANDOM) {
        // a big question mark with a dice-ish wobble when hovered
        const wob = hot ? Math.round(Math.sin(performance.now() / 90) * 1.5) : 0;
        const big = c.h >= 30 ? 3 : 2;
        drawText('?', c.x + 10 + wob, y + Math.floor(c.h / 2) - Math.floor(5 * big / 2), '#ffd23f', big);
        const tx = c.x + (big === 3 ? 33 : 27), ty = y + (big === 3 ? 5 : 3);
        drawText('RANDOM', tx, ty, '#ffffff');
        drawText('ANY BALL', tx, ty + 7, '#9fb6dc');
        drawText('KEY 0', tx, ty + 14, hot ? '#ffd23f' : '#7f93b8');
        return;
      }
      // ball (with weapon) on the left; smaller on compact cards
      const compact = c.h < 30;
      const k = compact ? 0.8 : 1;
      const cx = c.x + (compact ? 13 : 16), cy = y + Math.floor(c.h / 2) + (compact ? 1 : 0);
      const rr = t.radius * k;
      ctx.save();
      ctx.beginPath(); ctx.rect(c.x, y, compact ? 26 : 32, c.h); ctx.clip();
      if (t.weapon) {
        const ang = -Math.PI * 0.75 - (hot ? performance.now() / 300 : 0);
        drawAxe(cx, cy, ang, 1, 0.5 * k);
      }
      if (t.legs) drawLegs(cx, cy, rr, hot ? performance.now() / 120 : 0);
      if (t.studs) drawStuds(cx, cy, rr, hot ? performance.now() / 300 : 0);
      if (t.fangs) drawFangs(cx, cy, rr, 0, hot);
      if (t.cap) drawFuse(cx, cy, rr, hot ? 0.5 : 9);
      ctx.drawImage(t.sprite, Math.round(cx - rr), Math.round(cy - rr), Math.round(t.sprite.width * k), Math.round(t.sprite.height * k));
      if (t.fangs) drawVampEyes(cx, cy, rr, 0);
      ctx.restore();
      drawText(String(i + 1), c.x + 2, y + 2, hot ? '#ffd23f' : '#7f93b8');   // its number key
      // stats on the right
      const hit = t.rng ? t.rng.min + '-' + t.rng.max
        : t.damageRange ? t.damageRange[0] + '-' + t.damageRange[1] : String(t.damage);
      const [abilityTxt, abilityCol] = abilityText(t);
      if (compact) {
        // three lines: name / heart HP + sword damage / ability
        const tx = c.x + 27, ty = y + Math.max(2, Math.floor((c.h - 19) / 2));
        drawText(t.short, tx, ty, '#ffffff');
        drawIcon(HEART_ICON, tx, ty + 7, '#ff4f6d');
        drawText(String(t.hp), tx + 6, ty + 7, '#5ee07a');
        const sx = tx + 6 + textWidth(String(t.hp)) + 3;
        drawIcon(SWORD_ICON, sx, ty + 7, '#c9ced6');
        drawText(hit, sx + 6, ty + 7, t.rng ? '#ffd23f' : '#ff8a8a');
        if (abilityTxt) drawText(abilityTxt, tx, ty + 14, abilityCol);
      } else {
        const tx = c.x + 33, ty = y + Math.max(2, Math.floor((c.h - 28) / 2));
        drawText(t.short, tx, ty, '#ffffff');
        drawText('HP ' + t.hp, tx, ty + 8, '#5ee07a');
        drawText('HIT ' + hit, tx, ty + 16, t.rng ? '#ffd23f' : '#ff8a8a');
        if (abilityTxt) drawText(abilityTxt, tx, ty + 24, abilityCol);
      }
    });
  }

  function render() {
    ctx.fillStyle = '#0b1a33'; ctx.fillRect(0, 0, W, H);   // clear last frame (also under screen shake)
    ctx.save();
    if (shake > 0) {
      const m = Math.ceil(shake * 20);
      ctx.translate(Math.round((Math.random() - 0.5) * m), Math.round((Math.random() - 0.5) * m));
    }
    ctx.drawImage(bg, 0, 0);
    ctx.drawImage(arenaImg, 0, 0);

    // clip ball drawing to the arena floor
    ctx.save();
    ctx.beginPath();
    ctx.rect(PLAY.left, PLAY.top, PLAY.right - PLAY.left, PLAY.bottom - PLAY.top);
    ctx.clip();
    if (state === 'aim') drawAimArrow();
    if (state !== 'select') {
      drawWebs();
      drawSpikes();
      drawMiniBombs();
      drawChains();
      drawHeals();
      for (const b of balls) drawWeapon(b);
      for (const b of balls) drawBallWithFlash(b);
      for (const b of balls) drawWrap(b);
      for (const b of balls) drawCharge(b);
      for (const b of balls) drawShield(b);
      for (const b of balls) drawChill(b);
      drawEffects();
      drawExecuteFx();
    }
    for (const p of particles) {
      ctx.globalAlpha = 1 - p.t / p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    for (const p of popups) {
      const fade = p.t > 0.5 ? (0.8 - p.t) / 0.3 : 1;
      ctx.globalAlpha = Math.max(0, fade);
      drawTextCentered(p.text, p.x, Math.round(p.y), p.color);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // HUD (not shaken)
    if (state === 'select') drawSelect();
    else {
      drawPanel(sideBall(0), 8, false);
      drawPanel(sideBall(1), W - 8, true);
    }
    drawTextCentered('BALL VS BALL', W / 2, 3, '#ffffff', 1);

    if (state === 'aim') {
      const blink = Math.floor(performance.now() / 450) % 2 === 0;
      if (blink) drawTextCentered('CLICK TO LAUNCH', W / 2, H - 9, '#ffffff');
    } else if (state === 'over' && roundTimer > 0.6) {   // short pause so the final hit is visible
      ctx.fillStyle = 'rgba(8,14,30,0.55)';
      ctx.fillRect(0, H / 2 - 16, W, 30);
      const msg = winner ? SIDES[winner.side].label + (winner.side === 0 ? ' WIN!' : ' WINS!') : 'DRAW!';
      const col = winner ? SIDES[winner.side].color : '#ffffff';
      drawTextCentered(msg, W / 2, H / 2 - 12, col, 3);
      if (roundTimer > 1.2) drawTextCentered('CLICK TO PICK AGAIN  -  R FOR REMATCH', W / 2, H / 2 + 7, '#cfe0ff');
    }
  }

  // ---------------------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------------------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  reset();
  startSelect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
