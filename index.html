      const cfg = sh.owner.type.glass;
      if (sh.t > cfg.life) { sh.done = true; continue; }
      if (sh.t < 0.3) continue;
      for (const b of balls) {
        if (!b.alive || b.phased || b.side === sh.owner.side) continue;
        if (Math.hypot(b.x - sh.x, b.y - sh.y) > b.r + 3) continue;
        if (b.bleed <= 0) popups.push({ x: b.x, y: b.y - b.r - 12, text: 'BLEEDING!', t: -0.1, color: '#ff4f6d' });
        b.bleed = cfg.bleedTime;
        b.bleedSrc = sh.owner;
        burst(sh.x, sh.y, { light: '#ffffff', base: '#ff8a9a', dark: '#c0203a' }, 6);
        sh.done = true;
        break;
      }
    }
    shards = shards.filter(sh => !sh.done);
    for (const b of balls) {
      b.bleedCd = Math.max(0, b.bleedCd - dt);
      if (b.bleed > 0) {
        b.bleed = Math.max(0, b.bleed - dt);
        if (b.alive && Math.random() < dt * 8) {
          particles.push({ x: b.x + (Math.random() - 0.5) * b.r, y: b.y + b.r * 0.6, vx: 0, vy: 25, life: 0.4, t: 0, color: '#c0203a' });
        }
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Balloon: inflate (bigger, stronger, more HP, slower, squishier), then pop
  // ---------------------------------------------------------------------------
  function applyBalloon(b) {
    const cfg = b.type.balloon, k = b.inflate;
    const newMax = Math.round(lerp(...cfg.hp, k));
    // HP grows (or shrinks) along with max HP
    b.hp = b.maxHp ? Math.max(b.hp > 0 ? 1 : 0, b.hp * newMax / b.maxHp) : newMax;
    b.maxHp = newMax;
    b.r = lerp(...cfg.radius, k);
    b.speed = lerp(...cfg.speed, k);
  }

  function updateBalloon(b, dt) {
    const cfg = b.type.balloon;
    if (!cfg || !b.alive) return;
    b.inflate = Math.min(1, b.inflate + dt / cfg.fillTime);
    applyBalloon(b);
    if (b.inflate >= 1) {
      // POP: a burst that hurts anything close, then it's small again
      popups.push({ x: b.x, y: b.y - b.r - 8, text: 'POP!', t: -0.1, color: '#ff8ac0' });
      effects.push({ kind: 'boom', x: b.x, y: b.y, r: cfg.popRadius, t: 0, life: 0.3 });
      burst(b.x, b.y, b.type.colors, 20);
      shake = Math.max(shake, 0.25);
      for (const o of balls) {
        if (!o.alive || o.side === b.side) continue;
        if (Math.hypot(o.x - b.x, o.y - b.y) <= cfg.popRadius + o.r) hurt(o, cfg.popDamage, b, '#ff8ac0');
      }
      b.inflate = 0;
      applyBalloon(b);
    }
  }

  // ---------------------------------------------------------------------------
  // Healer: drops heals at random spots. Friends heal, enemies get hurt.
  // ---------------------------------------------------------------------------
  function updateHealer(b, dt) {
    const cfg = b.type.healer;
    if (!cfg || !b.alive) return;
    b.healT -= dt;
    if (b.healT > 0) return;
    b.healT = cfg.everyMin + Math.random() * (cfg.everyMax - cfg.everyMin);
    if (heals.filter(h => h.owner === b).length >= cfg.max) return;
    const pad = 10;
    heals.push({
      owner: b, t: 0,
      x: PLAY.left + pad + Math.random() * (PLAY.right - PLAY.left - pad * 2),
      y: PLAY.top + pad + Math.random() * (PLAY.bottom - PLAY.top - pad * 2),
    });
  }

  function updateHeals(dt) {
    for (const h of heals) {
      h.t += dt;
      const cfg = h.owner.type.healer;
      if (h.t > cfg.life) { h.done = true; continue; }
      if (h.t < 0.3) continue;   // not grabbable while it's still popping in
      for (const b of balls) {
        if (!b.alive || b.phased || Math.hypot(b.x - h.x, b.y - h.y) > b.r + 5) continue;
        if (b.side === h.owner.side) {
          const got = Math.min(cfg.heal, b.maxHp - b.hp);
          b.hp += got;
          popups.push({ x: b.x, y: b.y - b.r - 4, text: '+' + got, t: 0, color: '#5ee07a' });
          burst(h.x, h.y, { light: '#ffffff', base: '#8af5a0', dark: '#3fbf63' }, 10);
        } else {
          hurt(b, cfg.damage, h.owner, '#ff4f6d');
          popups.push({ x: b.x, y: b.y - b.r - 12, text: 'OUCH!', t: -0.1, color: '#ff4f6d' });
          burst(h.x, h.y, { light: '#ffffff', base: '#ff8a9a', dark: '#c0203a' }, 12);
        }
        h.done = true;
        break;
      }
    }
    heals = heals.filter(h => !h.done);
  }

  // ---------------------------------------------------------------------------
  // Shocker: charge up, stun whoever hits it while charged
  // ---------------------------------------------------------------------------
  function stun(b, time) {
    if (b.stuck <= 0) { b.savedVx = b.vx; b.savedVy = b.vy; }
    if (b.latch) detach(b);
    b.stuck = Math.max(b.stuck, time);
    b.stunned = true;
    b.vx = 0; b.vy = 0;
  }

  // `other` hit `shocker`: if it's charged, the hitter gets shocked and stunned.
  function shockCheck(shocker, other) {
    const cfg = shocker.type.shocker;
    if (!cfg || shocker.charged <= 0 || !shocker.alive || !other.alive || other.side === shocker.side || other.stunned) return false;
    stun(other, cfg.stun);
    hurt(other, cfg.damage, shocker, '#7fd8ff');
    popups.push({ x: other.x, y: other.y - other.r - 12, text: 'STUNNED!', t: -0.1, color: '#7fd8ff' });
    // a crackle of lightning between them
    const pts = [{ x: shocker.x, y: shocker.y }];
    for (let i = 1; i < 4; i++) {
      const t = i / 4;
      pts.push({ x: shocker.x + (other.x - shocker.x) * t + (Math.random() - 0.5) * 10, y: shocker.y + (other.y - shocker.y) * t + (Math.random() - 0.5) * 10 });
    }
    pts.push({ x: other.x, y: other.y });
    effects.push({ kind: 'bolt', pts, t: 0, life: 0.3 });
    burst(other.x, other.y, { light: '#ffffff', base: '#7fd8ff', dark: '#3d8fe0' }, 14);
    shake = Math.max(shake, 0.2);
    return true;
  }

  function updateShocker(b, dt) {
    const cfg = b.type.shocker;
    if (!cfg || !b.alive) return;
    if (b.charged > 0) { b.charged = Math.max(0, b.charged - dt); return; }
    b.shockT -= dt;
    if (b.shockT <= 0) {
      b.shockT = cfg.every;
      b.charged = cfg.charge;
      burst(b.x, b.y, { light: '#ffffff', base: '#7fd8ff', dark: '#3d8fe0' }, 10);
    }
  }

  // ---------------------------------------------------------------------------
  // Bomb, Ghost, Lightning
  // ---------------------------------------------------------------------------
  // Blast at (x, y): hurts and knocks back every enemy of `owner` in range.
  function explode(owner, x, y, radius, damage, knock) {
    effects.push({ kind: 'boom', x, y, r: radius, t: 0, life: 0.45 });
    shake = Math.max(shake, 0.3);
    burst(x, y, { light: '#fff3b0', base: '#ffb03b', dark: '#ff5a1f' }, 24);
    for (const foe of balls) {
      if (!foe.alive || foe.side === owner.side) continue;
      const dx = foe.x - x, dy = foe.y - y, d = Math.hypot(dx, dy) || 1;
      if (d > radius + foe.r) continue;
      if (hurt(foe, damage, owner, '#ffb03b') > 0 && foe.stuck <= 0 && !foe.latch) {
        foe.vx += dx / d * knock; foe.vy += dy / d * knock;
        clampSpeed(foe);
      }
    }
  }

  function updateBomb(b, dt) {
    const cfg = b.type.bomb;
    if (!cfg || !b.alive) return;
    b.fuse -= dt;
    if (b.fuse <= 0) {
      b.fuse = cfg.every;
      explode(b, b.x, b.y, cfg.radius, cfg.damage, cfg.knock);
    }
    // drop a mini bomb at a random spot
    const m = cfg.mini;
    b.miniT -= dt;
    if (b.miniT <= 0) {
      b.miniT = m.everyMin + Math.random() * (m.everyMax - m.everyMin);
      if (miniBombs.filter(mb => mb.owner === b).length < m.max) {
        const pad = 10;
        miniBombs.push({
          owner: b, fuse: m.fuse, t: 0,
          x: PLAY.left + pad + Math.random() * (PLAY.right - PLAY.left - pad * 2),
          y: PLAY.top + pad + Math.random() * (PLAY.bottom - PLAY.top - pad * 2),
        });
      }
    }
  }

  function updateMiniBombs(dt) {
    for (const mb of miniBombs) {
      mb.t += dt;
      mb.fuse -= dt;
      if (mb.fuse <= 0) {
        const m = mb.owner.type.bomb.mini;
        explode(mb.owner, mb.x, mb.y, m.radius, m.damage, m.knock);
      }
    }
    miniBombs = miniBombs.filter(mb => mb.fuse > 0);
  }

  function updateGhost(b, dt) {
    const cfg = b.type.ghost;
    if (!cfg || !b.alive) return;
    b.phaseT -= dt;
    if (b.phaseT > 0) return;
    b.phased = !b.phased;
    b.phaseT = b.phased ? cfg.faded : cfg.solid;
    if (b.phased && b.stuck > 0) b.stuck = 0.0001;   // fading out slips free of a web
    burst(b.x, b.y, { light: '#ffffff', base: '#e6e0f5', dark: '#b9b0d6' }, 10);
  }

  function updateZap(b, dt) {
    const cfg = b.type.zap;
    if (!cfg || !b.alive) return;
    b.zapT -= dt;
    if (b.zapT > 0) return;
    b.zapT = cfg.every;
    const foe = foeOf(b);
    if (!foe || !foe.alive) return;
    // a jagged bolt from the ball to the enemy
    const pts = [{ x: b.x, y: b.y }];
    const steps = 7;
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      pts.push({ x: b.x + (foe.x - b.x) * t + (Math.random() - 0.5) * 14, y: b.y + (foe.y - b.y) * t + (Math.random() - 0.5) * 14 });
    }
    pts.push({ x: foe.x, y: foe.y });
    effects.push({ kind: 'bolt', pts, t: 0, life: 0.25 });
    hurt(foe, cfg.damage, b, '#ffe14d');
    burst(foe.x, foe.y, { light: '#ffffff', base: '#ffe14d', dark: '#6f8ff5' }, 10);
    shake = Math.max(shake, 0.1);
  }

  // ---------------------------------------------------------------------------
  // Spider webs
  // ---------------------------------------------------------------------------
  function spiderTouchWall(spider, hit) {
    const w = spider.type.web;
    if (!spider.strand) {
      // first wall: anchor a strand here
      spider.strand = { x: hit.x, y: hit.y, wall: hit.wall };
      burst(hit.x, hit.y, { light: '#ffffff', base: '#e6e9f2', dark: '#b7bfd3' }, 4);
      return;
    }
    if (spider.strand.wall === hit.wall) {
      // same wall again: just move the anchor
      spider.strand = { x: hit.x, y: hit.y, wall: hit.wall };
      return;
    }
    // a different wall: the web is set between the two spots
    webs.push({ x1: spider.strand.x, y1: spider.strand.y, x2: hit.x, y2: hit.y, owner: spider, t: 0, life: w.life });
    // too many webs: drop the oldest
    while (webs.filter(wb => wb.owner === spider).length > w.max) {
      webs.splice(webs.findIndex(wb => wb.owner === spider), 1);
    }
    spider.strand = null;
    popups.push({ x: hit.x, y: hit.y - 6, text: 'WEB!', t: 0, color: '#e6e9f2' });
    burst(hit.x, hit.y, { light: '#ffffff', base: '#e6e9f2', dark: '#b7bfd3' }, 8);
  }

  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
    return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
  }

  function updateWebs(dt) {
    for (const wb of webs) wb.t += dt;
    webs = webs.filter(wb => wb.t < wb.life);
    for (const b of balls) {
      if (!b.alive) continue;
      b.webImmune = Math.max(0, b.webImmune - dt);
      if (b.stuck > 0) {
        b.stuck -= dt;
        if (b.stuck <= 0) {
          // the stun wears off and the ball carries on
          b.stuck = 0;
          b.stunned = false;
          b.vx = b.savedVx; b.vy = b.savedVy;
          burst(b.x, b.y, { light: '#ffffff', base: '#7fd8ff', dark: '#3d8fe0' }, 10);
        }
        continue;
      }
      if (b.webImmune > 0 || b.latch || b.phased) continue;   // a biting vampire or faded ghost passes over webs
      // touching an enemy web stings for a little damage
      for (const wb of webs) {
        if (wb.owner === b || wb.owner.side === b.side) continue;
        if (distToSegment(b.x, b.y, wb.x1, wb.y1, wb.x2, wb.y2) > b.r) continue;
        const cfg = wb.owner.type.web;
        b.webImmune = cfg.hitCooldown;
        hurt(b, cfg.damage, wb.owner, '#e6e9f2');
        burst(b.x, b.y, { light: '#ffffff', base: '#e6e9f2', dark: '#b7bfd3' }, 4);
        break;
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------
  const STEP = 1 / 120;
  const BALL_CHILL_SLOW = BALL_TYPES.ice.freeze.slow;

  function update(dt) {
    roundTimer += dt;
    if (state === 'fight') {
      for (const b of balls) {
        if (!b.alive || b.stuck > 0 || b.latch) continue;
        settleSpeed(b, dt);
        const slow = b.chill > 0 ? 1 - BALL_CHILL_SLOW : 1;   // chilled balls crawl
        b.x += b.vx * dt * slow;
        b.y += b.vy * dt * slow;
        bounceWalls(b);
        b.spikeCd = Math.max(0, b.spikeCd - dt);
        spikeCollisions(b);
      }
      for (const b of balls) {
        updateVampire(b, dt);
        updateBomb(b, dt);
        updateGhost(b, dt);
        updateZap(b, dt);
        updateShocker(b, dt);
        updateHealer(b, dt);
        updateMagnet(b, dt);
        updateBalloon(b, dt);
        updateGun(b, dt);
        b.chill = Math.max(0, b.chill - dt);
      }
      for (const sp of spikes) sp.t += dt;
      updateMiniBombs(dt);
      updateChains(dt);
      updateHeals(dt);
      updateShards(dt);
      updateBullets(dt);
      updateZones(dt);
      for (let i = 0; i < balls.length; i++)
        for (let j = i + 1; j < balls.length; j++) {
          const a = balls[i], b = balls[j];
          if (!a.alive || !b.alive) continue;
          if ((a.latch && a.latch.target === b) || (b.latch && b.latch.target === a)) continue;
          if (a.phased || b.phased) continue;   // a faded ghost passes straight through
          axeClash(a, b);
          axeHits(a, b);
          axeHits(b, a);
          if (a.alive && b.alive) collideBalls(a, b);
        }
      for (const b of balls) if (b.latch && !b.alive) b.latch = null;

      updateWebs(dt);

      const alive = balls.filter(b => b.alive);
      if (new Set(alive.map(b => b.side)).size <= 1) {   // one side (or nobody) left
        state = 'over';
        winner = alive[0] || null;
        roundTimer = 0;
      }
    }
    for (const b of balls) {
      updateWeapon(b, dt);
      updateRng(b, dt);
      b.flash = Math.max(0, b.flash - dt);
      b.squash = Math.max(0, b.squash - dt);
    }
    for (const p of popups) { p.t += dt; if (p.t > 0) p.y -= 14 * dt; }
    popups = popups.filter(p => p.t < 0.8);
    for (const p of particles) {
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.97; p.vy *= 0.97;
    }
    particles = particles.filter(p => p.t < p.life);
    for (const fx of effects) fx.t += dt;
    effects = effects.filter(fx => fx.t < fx.life);
    for (const fx of executeFx) fx.t += dt;
    executeFx = executeFx.filter(fx => fx.t < 0.7);
    shake = Math.max(0, shake - dt);
  }

  // ---------------------------------------------------------------------------
  // Draw
  // ---------------------------------------------------------------------------
  function pixLine(x0, y0, x1, y1) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (let i = 0; i < 400; i++) {
      ctx.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  // Fine drawing, in hi-px (1/RES of a world px), for everything attached to a ball.
  function fpx(x, y, w = 1, h = 1) { ctx.fillRect(snap(x), snap(y), w / RES, h / RES); }
  // A hi-px line, `w` hi-px thick. `color` may be a function of the step, for striped ropes.
  function fineLine(x0, y0, x1, y1, w = 1, color = null) {
    x0 = Math.round(x0 * RES); y0 = Math.round(y0 * RES); x1 = Math.round(x1 * RES); y1 = Math.round(y1 * RES);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (let i = 0; i < 2000; i++) {
      if (color) ctx.fillStyle = color(i);
      ctx.fillRect(x0 / RES, y0 / RES, w / RES, w / RES);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  // Fill a shape around (cx, cy) in hi-px. test(u, v) gets world-px coordinates along `ang` (u)
  // and across it (v), and returns a color or nothing; `outline` rings the shape with 1 hi-px.
  function fineShape(cx, cy, reach, ang, test, outline) {
    const c = Math.cos(ang), s = Math.sin(ang), e = 1 / RES;
    const i0 = Math.floor((cx - reach) * RES), i1 = Math.ceil((cx + reach) * RES);
    const j0 = Math.floor((cy - reach) * RES), j1 = Math.ceil((cy + reach) * RES);
    for (let j = j0; j < j1; j++) for (let i = i0; i < i1; i++) {
      const wx = (i + 0.5) / RES - cx, wy = (j + 0.5) / RES - cy;
      const u = wx * c + wy * s, v = -wx * s + wy * c;
      let col = test(u, v);
      if (!col && outline && (test(u + e, v) || test(u - e, v) || test(u, v + e) || test(u, v - e))) col = outline;
      if (col) { ctx.fillStyle = col; ctx.fillRect(i / RES, j / RES, e, e); }
    }
  }
  // Is (u, v) inside the triangle a-b-c?
  function inTri(u, v, ax2, ay2, bx, by, cx, cy) {
    const d1 = (u - bx) * (ay2 - by) - (ax2 - bx) * (v - by);
    const d2 = (u - cx) * (by - cy) - (bx - cx) * (v - cy);
    const d3 = (u - ax2) * (cy - ay2) - (cx - ax2) * (v - ay2);
    return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
  }

  // Eight jointed legs, four per side, scuttling while the spider moves.
  function drawLegs(x, y, r, phase) {
    for (const side of [-1, 1]) {
      for (let i = 0; i < 4; i++) {
        const a = (-0.75 + i * 0.5);              // spread from front to back
        const wig = Math.sin(phase + i * 1.7 + (side > 0 ? Math.PI : 0)) * 0.18;
        const ang = (side > 0 ? 0 : Math.PI) + side * (a + wig);
        const hipX = x + Math.cos(ang) * (r - 2), hipY = y + Math.sin(ang) * (r - 2);
        const kneeX = x + Math.cos(ang) * (r + 5), kneeY = y + Math.sin(ang) * (r + 5) - 4;
        const footX = x + Math.cos(ang) * (r + 9), footY = y + Math.sin(ang) * (r + 9) + 2;
        // thick at the hip, thin at the foot, with a dark underside, a lit knee and a dark tip
        ctx.fillStyle = '#120d19';
        fineLine(hipX, hipY + 0.5, kneeX, kneeY + 0.5, 2); fineLine(kneeX, kneeY + 0.5, footX, footY + 0.5, 1);
        ctx.fillStyle = '#5a4874';
        fineLine(hipX, hipY, kneeX, kneeY, 2); fineLine(kneeX, kneeY, footX, footY, 1);
        ctx.fillStyle = '#8a76a8'; fpx(kneeX, kneeY);
        ctx.fillStyle = '#2a2038'; fpx(footX, footY);
      }
    }
  }

  // Big purple X slashed across an executed ball.
  function drawExecuteFx() {
    for (const fx of executeFx) {
      const grow = Math.min(1, fx.t / 0.15);
      const len = 22 * grow;
      ctx.globalAlpha = 1 - Math.max(0, (fx.t - 0.3) / 0.4);
      for (const [w, col] of [[3, '#3b1a6e'], [1, '#ffffff']]) {
        ctx.fillStyle = col;
        for (let o = -Math.floor(w / 2); o <= Math.floor(w / 2); o++) {
          pixLine(fx.x - len, fx.y - len + o, fx.x + len, fx.y + len + o);
          pixLine(fx.x - len, fx.y + len + o, fx.x + len, fx.y - len + o);
        }
      }
      ctx.fillStyle = '#d6a8ff';
      pixLine(fx.x - len, fx.y - len - 2, fx.x + len, fx.y + len - 2);
      pixLine(fx.x - len, fx.y + len - 2, fx.x + len, fx.y - len - 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawSpikes() {
    for (const sp of spikes) {
      const g = Math.min(1, sp.t / 0.15);   // grows out of the wall
      const tipX = sp.cx + sp.nx * sp.len * g, tipY = sp.cy + sp.ny * sp.len * g;
      const tri = { x1: sp.x1, y1: sp.y1, x2: sp.x2, y2: sp.y2, px: tipX, py: tipY };
      const minX = Math.floor(Math.min(sp.x1, sp.x2, tipX)), maxX = Math.ceil(Math.max(sp.x1, sp.x2, tipX));
      const minY = Math.floor(Math.min(sp.y1, sp.y2, tipY)), maxY = Math.ceil(Math.max(sp.y1, sp.y2, tipY));
      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const px = x + 0.5, py = y + 0.5;
          if (!insideTriangle(px, py, tri)) continue;
          // shade: one face lit, the other in shadow, dark outline on the edges
          const side = (px - sp.cx) * -sp.ny + (py - sp.cy) * sp.nx;
          const e1 = closestOnSegment(px, py, sp.x1, sp.y1, tipX, tipY);
          const e2 = closestOnSegment(px, py, sp.x2, sp.y2, tipX, tipY);
          const edge = Math.min(Math.hypot(px - e1.x, py - e1.y), Math.hypot(px - e2.x, py - e2.y)) < 0.9;
          ctx.fillStyle = edge ? '#1b1f25' : side > 0.5 ? '#e4e8ee' : side < -0.5 ? '#7b828c' : '#b4bbc5';
          ctx.fillRect(x, y, 1, 1);
        }
      }
      // red-tipped point
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(Math.round(tipX - sp.nx * 1.5) - (sp.nx ? 0 : 0), Math.round(tipY - sp.ny * 1.5), 1, 1);
    }
  }

  // Steel studs around the Spike Ball's rim, the same material as the wall spikes:
  // a lit face, a shadow face, a dark outline and a bright tip.
  function drawStuds(x, y, r, spin) {
    const step = Math.PI / 4;
    fineShape(x, y, r + 5, spin, (u, v) => {
      const k = Math.round(Math.atan2(v, u) / step), a = k * step;
      const p = u * Math.cos(a) + v * Math.sin(a), q = -u * Math.sin(a) + v * Math.cos(a);
      const len = (p - (r - 0.5)) / 4.5;
      if (len < 0 || len > 1 || Math.abs(q) > 1.7 * (1 - len)) return;
      if (len > 0.78) return '#ffffff';
      // which half faces the light (top-left)?
      const A = spin + a, lit = q * (-Math.sin(A) * -0.6 + Math.cos(A) * -0.7) > 0;
      return lit ? '#e4e8ee' : '#7b828c';
    }, '#1b1f25');
  }
  // A dark rivet where each stud meets the ball (drawn over the ball).
  function drawStudRivets(x, y, r, spin) {
    ctx.fillStyle = '#2a0d07';
    for (let i = 0; i < 8; i++) {
      const a = spin + i * Math.PI / 4;
      fpx(x + Math.cos(a) * (r - 1.2) - 0.5, y + Math.sin(a) * (r - 1.2) - 0.5, 2, 2);
    }
  }

  // The Vampire Ball's cape collar: two pointed black wings on its back, lined in red.
  function drawCape(x, y, r, face) {
    fineShape(x, y, r + 6, face + Math.PI, (u, v) => {
      for (const s of [-1, 1]) {
        if (inTri(u, v * s, r - 3, 1, r - 3, 8, r + 4, 6.5)) {
          return inTri(u, v * s, r - 2, 2.6, r - 2, 6.6, r + 2, 5.6) ? '#c0203a' : '#12030a';
        }
      }
    }, '#05010a');
  }

  // The Vampire Ball's face, turned toward its prey: a dark mouth with two fangs that
  // reach past its rim (bloody while latched), and slanted glowing eyes.
  function drawVampFace(x, y, r, face, bloody) {
    const m = r - 3.5;
    fineShape(x, y, r + 5, face, (u, v) => {
      for (const s of [-1, 1]) {
        const k = (u - m) / 7, dv = v - s * 1.3;
        if (k >= 0 && k <= 1 && Math.abs(dv) <= 0.9 * (1 - k) + 0.1) {
          if (bloody && k > 0.6) return '#c0203a';
          return dv * s < 0 ? '#f4f1ea' : '#c9c2b4';
        }
      }
      // the mouth: a dark crescent the fangs grow out of
      if ((v / 2.6) ** 2 + ((u - m) / 1.1) ** 2 <= 1 && !((v / 2.2) ** 2 + ((u - m + 0.9) / 0.9) ** 2 < 1)) return '#12030a';
    }, '#12030a');
    // eyes: the brows slant down toward the middle of the face
    const eyes = [-0.95, 0.95].map(off => ({ x: x + Math.cos(face + off) * (r - 4), y: y + Math.sin(face + off) * (r - 4) }));
    eyes.sort((a, b) => a.x - b.x);
    eyes.forEach((e, n) => {
      ctx.fillStyle = '#ff2a3a'; fpx(e.x - 0.75, e.y - 0.5, 3, 2);
      ctx.fillStyle = '#ffd0d4'; fpx(e.x - 0.75, e.y - 0.5);
      ctx.fillStyle = '#12030a';
      fpx(e.x - 0.75, e.y - 1 + (n ? 0.5 : 0), 1, 1); fpx(e.x - 0.25, e.y - 1, 1, 1); fpx(e.x + 0.25, e.y - 1 + (n ? 0 : 0.5), 1, 1);
    });
  }

  function drawWebs() {
    for (const wb of webs) {
      const fade = Math.min(1, (wb.life - wb.t) / 1.5);
      const dx = wb.x2 - wb.x1, dy = wb.y2 - wb.y1, len = Math.hypot(dx, dy) || 1;
      const px = -dy / len, py = dx / len;   // perpendicular
      ctx.globalAlpha = 0.9 * fade;
      ctx.fillStyle = '#f2f4fa';
      pixLine(wb.x1, wb.y1, wb.x2, wb.y2);                       // main thread
      ctx.globalAlpha = 0.55 * fade;
      ctx.fillStyle = '#d6dbe8';
      pixLine(wb.x1 + px * 3, wb.y1 + py * 3, wb.x2 + px * 3, wb.y2 + py * 3);
      pixLine(wb.x1 - px * 3, wb.y1 - py * 3, wb.x2 - px * 3, wb.y2 - py * 3);
      // zig-zag cross threads tying the three strands together
      const steps = Math.floor(len / 5);
      for (let i = 0; i < steps; i++) {
        const t0 = i / steps, t1 = (i + 1) / steps;
        const s0 = i % 2 ? 3 : -3, s1 = -s0;
        pixLine(wb.x1 + dx * t0 + px * s0, wb.y1 + dy * t0 + py * s0,
                wb.x1 + dx * t1 + px * s1, wb.y1 + dy * t1 + py * s1);
      }
      // anchor knots on the walls
      ctx.globalAlpha = fade;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(wb.x1) - 1, Math.round(wb.y1) - 1, 3, 3);
      ctx.fillRect(Math.round(wb.x2) - 1, Math.round(wb.y2) - 1, 3, 3);
    }
    ctx.globalAlpha = 1;
    // strands still being spun, from the wall anchor to the spider
    for (const b of balls) {
      if (!b.alive || !b.strand) continue;
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = '#e6e9f2';
      const n = Math.max(1, Math.floor(Math.hypot(b.x - b.strand.x, b.y - b.strand.y) / 2));
      for (let i = 0; i <= n; i += 2) {
        const t = i / n;
        ctx.fillRect(Math.round(b.strand.x + (b.x - b.strand.x) * t), Math.round(b.strand.y + (b.y - b.strand.y) * t), 1, 1);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(b.strand.x) - 1, Math.round(b.strand.y) - 1, 2, 2);
    }
  }

  // A solid 1 px ring.
  function ring(x, y, R, color) {
    if (R < 1) return;
    ctx.fillStyle = color;
    const n = Math.ceil(R * 7);
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      ctx.fillRect(Math.round(x + Math.cos(a) * R), Math.round(y + Math.sin(a) * R), 1, 1);
    }
  }
  // A disc whose see-through-ness is a 2x2 ordered dither instead of blending.
  function ditherDisc(x, y, R, color, alpha) {
    if (alpha <= 0 || R < 1) return;
    ctx.fillStyle = color;
    for (let dy = -Math.floor(R); dy <= R; dy++) {
      const w = Math.floor(Math.sqrt(R * R - dy * dy)), py = Math.round(y + dy);
      for (let px = Math.round(x - w); px <= Math.round(x + w); px++) {
        if ((BAYER[(px & 1) + (py & 1) * 2] + 0.5) / 4 < alpha) ctx.fillRect(px, py, 1, 1);
      }
    }
  }

  function drawEffects() {
    for (const fx of effects) {
      const k = fx.t / fx.life;
      if (fx.kind === 'boom') {
        // layered blast: a white flash, a yellow fireball, an orange shock ring, then smoke
        const R = fx.r * Math.min(1, k * 3);
        if (fx.t < 0.05) ditherDisc(fx.x, fx.y, R * 0.5, '#ffffff', 1);
        ditherDisc(fx.x, fx.y, R * 0.75, '#ffe14d', Math.max(0, 0.6 - k * 1.2));
        ctx.globalAlpha = 1 - k;
        ring(fx.x, fx.y, R, '#ff8a3d');
        ring(fx.x, fx.y, R - 1, '#fff3b0');
        ctx.globalAlpha = 1;
        for (let i = 0; i < 5; i++) {
          // smoke puffs at fixed spots around the blast, drifting up as they fade
          const a = i * 2.4 + fx.x * 0.1, d = fx.r * (0.3 + (i % 3) * 0.15);
          ditherDisc(fx.x + Math.cos(a) * d, fx.y + Math.sin(a) * d - k * 10, 3 + (i % 4), '#8a2a12', 0.6 * (1 - k) * Math.min(1, k * 4));
        }
      } else if (fx.kind === 'pulse') {
        // magnet blast: a solid red ring with a blue one inside, rushing outward
        const R = fx.r * Math.min(1, k * 2.5);
        ctx.globalAlpha = 1 - k;
        ring(fx.x, fx.y, R, '#ff5a5a');
        ring(fx.x, fx.y, R * 0.8, '#7fb2ff');
        ring(fx.x, fx.y, R * 0.8 - 1, '#ffffff');
      } else if (fx.kind === 'bolt') {
        ctx.globalAlpha = 1 - k;
        for (const [off, col] of [[1, '#6f8ff5'], [-1, '#6f8ff5'], [0, '#ffffff']]) {
          ctx.fillStyle = col;
          for (let i = 0; i < fx.pts.length - 1; i++) {
            pixLine(fx.pts[i].x + off, fx.pts[i].y, fx.pts[i + 1].x + off, fx.pts[i + 1].y);
          }
        }
        ctx.fillStyle = '#ffe14d';
        for (let i = 0; i < fx.pts.length - 1; i++) pixLine(fx.pts[i].x, fx.pts[i].y + 1, fx.pts[i + 1].x, fx.pts[i + 1].y + 1);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Iron chains: from a wall anchor to the Chained Ball (held) or to a caught enemy (locked).
  function drawChains() {
    for (const c of chains) {
      const end = c.target || c.owner;
      if (!end.alive) continue;
      const dx = end.x - c.ax, dy = end.y - c.ay, d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      const locked = !!c.target;
      // links alternate: a flat ring (two rails) then one seen edge-on (a single bar)
      const steel = locked ? '#e4e8ee' : '#a4abb6', shade = locked ? '#8a929e' : '#5f6670';
      for (let s2 = 0, k = 0; s2 < d - end.r + 2; s2 += 4, k++) {
        const x = c.ax + ux * s2, y = c.ay + uy * s2;
        const x2 = x + ux * 4, y2 = y + uy * 4;
        if (k % 2 === 0) {
          ctx.fillStyle = steel;
          pixLine(x - uy * 1.5, y + ux * 1.5, x2 - uy * 1.5, y2 + ux * 1.5);
          ctx.fillStyle = shade;
          pixLine(x + uy * 1.5, y - ux * 1.5, x2 + uy * 1.5, y2 - ux * 1.5);
        } else {
          ctx.fillStyle = shade;
          pixLine(x + uy * 0.6, y - ux * 0.6, x2 + uy * 0.6, y2 - ux * 0.6);
          ctx.fillStyle = steel;
          pixLine(x, y, x2, y2);
        }
      }
      // anchor bolt on the wall
      ctx.fillStyle = '#221c14'; ctx.fillRect(Math.round(c.ax) - 2, Math.round(c.ay) - 2, 5, 5);
      ctx.fillStyle = locked ? '#ffe14d' : '#c9ced6'; ctx.fillRect(Math.round(c.ax) - 1, Math.round(c.ay) - 1, 3, 3);
      // shackle around a caught ball
      if (locked) {
        ctx.fillStyle = '#c9ced6';
        for (let i = 0; i < 16; i++) {
          if (i % 4 === 3) continue;
          const a = i / 16 * Math.PI * 2;
          ctx.fillRect(Math.round(end.x + Math.cos(a) * (end.r + 1)), Math.round(end.y + Math.sin(a) * (end.r + 1)), 1, 1);
        }
      }
    }
  }

  // Magnet field lines flowing inward while it pulls.
  function drawMagnetField(b) {
    if (!b.alive || !b.type.magnet || !b.pulling) return;
    const R = b.type.magnet.range;
    const now = performance.now() / 1000;
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      const f = 1 - ((now * 0.9 + i * 0.37) % 1);   // moves from the edge toward the magnet
      const rr = b.r + 3 + (R - b.r) * f;
      ctx.globalAlpha = 0.25 + 0.6 * (1 - f);
      ctx.fillStyle = i % 2 ? '#7fb2ff' : '#ff7a7a';
      ctx.fillRect(Math.round(b.x + Math.cos(a) * rr), Math.round(b.y + Math.sin(a) * rr), 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // Glass shards: little glinting triangles.
  function drawShards() {
    for (const sh of shards) {
      const left = sh.owner.type.glass.life - sh.t;
      if (left < 2 && Math.floor(performance.now() / 100) % 2) continue;
      const c = Math.cos(sh.ang), s2 = Math.sin(sh.ang);
      const tri = {
        x1: sh.x - c * 3 + s2 * 2, y1: sh.y - s2 * 3 - c * 2,
        x2: sh.x - c * 3 - s2 * 2, y2: sh.y - s2 * 3 + c * 2,
        px: sh.x + c * 4, py: sh.y + s2 * 4,
      };
      for (let y = Math.floor(sh.y - 5); y <= sh.y + 5; y++) for (let x = Math.floor(sh.x - 5); x <= sh.x + 5; x++) {
        if (!insideTriangle(x + 0.5, y + 0.5, tri)) continue;
        ctx.fillStyle = (x + y) % 3 === 0 ? '#ffffff' : '#bfeeff';
        ctx.fillRect(x, y, 1, 1);
      }
      if (Math.floor(performance.now() / 300 + sh.ang * 3) % 5 === 0) {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(sh.x + c * 4), Math.round(sh.y + s2 * 4) - 1, 1, 3);
      }
    }
  }

  // Cracks spreading over a damaged Glass Ball from one impact point: white where they
  // catch the light, with a dark pixel of shadow beside them.
  function drawCracks(b) {
    if (!b.type.glass) return;
    const n = Math.floor((1 - b.hp / b.maxHp) * 6);
    const ix = b.x + b.r * 0.35, iy = b.y - b.r * 0.3;   // the impact point
    const inside = (px2, py2) => {
      const dx = px2 - b.x, dy = py2 - b.y, d = Math.hypot(dx, dy), m = b.r - 1.5;
      return d <= m ? [px2, py2] : [b.x + dx / d * m, b.y + dy / d * m];
    };
    for (const [col, o] of [['#3a7fa0', 0.5], ['#ffffff', 0]]) {
      ctx.fillStyle = col;
      for (let i = 0; i < n; i++) {
        const a = i * 2.4 + 2.2, len = b.r * (0.55 + (i % 3) * 0.2);
        const [xm, ym] = inside(ix + Math.cos(a) * len * 0.5, iy + Math.sin(a) * len * 0.5);
        const [x2, y2] = inside(ix + Math.cos(a + 0.35) * len, iy + Math.sin(a + 0.35) * len);
        fineLine(ix + o, iy + o, xm + o, ym + o); fineLine(xm + o, ym + o, x2 + o, y2 + o);
      }
    }
  }

  // Balloon string trailing behind it.
  function drawString(b) {
    if (!b.alive || !b.type.knot) return;
    const sp = Math.hypot(b.vx, b.vy) || 1;
    const ux = -b.vx / sp, uy = -b.vy / sp;   // trails opposite to its motion (straight down when still)
    const bx = ux || 0, by = (sp > 1 ? uy : 1);
    ctx.fillStyle = '#f4f1ee';
    let px = b.x + bx * (b.r + 1), py = b.y + by * (b.r + 1);
    for (let i = 1; i <= 12; i++) {
      const w = Math.sin(performance.now() / 260 + i * 0.55) * 1.1 * (i / 12);   // a gentle sway, stronger at the end
      const nx = b.x + bx * (b.r + 1 + i * 1.3) - by * w, ny = b.y + by * (b.r + 1 + i * 1.3) + bx * w;
      fineLine(px, py, nx, ny);
      px = nx; py = ny;
    }
  }

  // Heal pickups: a glowing green cross that bobs and blinks before it fades out.
  function drawHeals() {
    for (const h of heals) {
      const cfg = h.owner.type.healer;
      const left = cfg.life - h.t;
      if (left < 2 && Math.floor(performance.now() / 100) % 2) continue;   // blink when about to vanish
      const pop = Math.min(1, h.t / 0.2);
      const y = Math.round(h.y + Math.sin(performance.now() / 250 + h.x) * 1.5);
      const x = Math.round(h.x);
      ctx.globalAlpha = 0.25 * pop;
      ctx.fillStyle = '#8af5a0';
      for (let dy = -6; dy <= 6; dy++) {
        const w2 = Math.floor(Math.sqrt(36 - dy * dy));
        ctx.fillRect(x - w2, y + dy, w2 * 2 + 1, 1);
      }
      ctx.globalAlpha = 1;
      const a = Math.round(3 * pop), bw = Math.max(1, Math.round(pop));
      ctx.fillStyle = '#14501c';
      ctx.fillRect(x - a - 1, y - bw - 1, a * 2 + 3, bw * 2 + 3); ctx.fillRect(x - bw - 1, y - a - 1, bw * 2 + 3, a * 2 + 3);
      ctx.fillStyle = '#5ee07a';
      ctx.fillRect(x - a, y - bw, a * 2 + 1, bw * 2 + 1); ctx.fillRect(x - bw, y - a, bw * 2 + 1, a * 2 + 1);
      // beveled like the Healer's cross: lit top-left edges, shaded bottom-right ones
      ctx.fillStyle = '#a8f5b8';
      fpx(x - a, y - bw, (a * 2 + 1) * RES, 1); fpx(x - bw, y - a, (bw * 2 + 1) * RES, 1);
      fpx(x - a, y - bw, 1, (bw * 2 + 1) * RES); fpx(x - bw, y - a, 1, (a * 2 + 1) * RES);
      ctx.fillStyle = '#2f9e3a';
      fpx(x - a, y + bw + 1 - 1 / RES, (a * 2 + 1) * RES, 1); fpx(x - bw, y + a + 1 - 1 / RES, (bw * 2 + 1) * RES, 1);
      fpx(x + a + 1 - 1 / RES, y - bw, 1, (bw * 2 + 1) * RES); fpx(x + bw + 1 - 1 / RES, y - a, 1, (a * 2 + 1) * RES);
      ctx.fillStyle = '#ffffff'; fpx(x - bw, y - a, 2, 2);
    }
  }

  // Mini bombs: a small bomb with a lit fuse, and a blinking ring showing its huge blast.
  function drawMiniBombs() {
    for (const mb of miniBombs) {
      const m = mb.owner.type.bomb.mini;
      const blink = Math.floor(performance.now() / (mb.fuse < 0.7 ? 60 : 160)) % 2 === 0;
      // warning ring
      ctx.globalAlpha = blink ? 0.9 : 0.45;
      ctx.fillStyle = '#ff7a3d';
      const dots = 160;
      for (let i = 0; i < dots; i++) {
        if (i % 4 === 3) continue;   // dashed
        const a = i / dots * Math.PI * 2;
        ctx.fillRect(Math.round(mb.x + Math.cos(a) * m.radius), Math.round(mb.y + Math.sin(a) * m.radius), 1, 1);
      }
      // the danger zone fills in as the fuse burns down
      const k = 1 - mb.fuse / m.fuse;
      const R = m.radius * k;
      ctx.globalAlpha = 0.08 + 0.1 * k;
      for (let dy = -R; dy <= R; dy++) {
        const w = Math.floor(Math.sqrt(R * R - dy * dy));
        ctx.fillRect(Math.round(mb.x - w), Math.round(mb.y + dy), w * 2 + 1, 1);
      }
      ctx.globalAlpha = 1;
      // the bomb itself, popping in when it lands
      const r = Math.round(5 * Math.min(1, mb.t / 0.12));
      if (r <= 0) continue;
      // orange outline so it stands out on the dark floor
      ctx.fillStyle = blink ? '#ff7a3d' : '#b5502a';
      for (let dy = -r - 1; dy <= r + 1; dy++) {
        const w = Math.floor(Math.sqrt((r + 1) * (r + 1) - dy * dy));
        ctx.fillRect(Math.round(mb.x - w), Math.round(mb.y + dy), w * 2 + 1, 1);
      }
      for (let dy = -r; dy <= r; dy++) {
        const w = Math.floor(Math.sqrt(r * r - dy * dy));
        ctx.fillStyle = '#2b2f3a';
        ctx.fillRect(Math.round(mb.x - w), Math.round(mb.y + dy), w * 2 + 1, 1);
      }
      ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(mb.x - 2), Math.round(mb.y - 3), 1, 1);
      ctx.fillStyle = '#5a6070'; ctx.fillRect(Math.round(mb.x - 2), Math.round(mb.y - 3), 2, 1);
      ctx.fillStyle = '#c9a36b'; pixLine(mb.x, mb.y - r, mb.x + 2, mb.y - r - 3);
      if (blink) { ctx.fillStyle = '#fff3b0'; ctx.fillRect(Math.round(mb.x + 2), Math.round(mb.y - r - 4), 2, 2); }
    }
  }

  // Bomb fuse: a striped rope curling right, with a four-ray spark that flickers
  // faster as it burns down.
  function drawFuse(x, y, r, fuseLeft) {
    const rope = k => Math.floor(k / 2) % 2 ? '#8a6a3a' : '#c9a36b';
    fineLine(x + 0.5, y - r - 1, x + 1.5, y - r - 3.5, 2, rope);
    fineLine(x + 1.5, y - r - 3.5, x + 4, y - r - 4.5, 2, rope);
    const rate = fuseLeft < 1 ? 40 : 120;
    if (Math.floor(performance.now() / rate) % 2 === 0) {
      const sx = x + 5, sy = y - r - 5;
      ctx.fillStyle = '#ff8a3d'; fpx(sx - 2, sy); fpx(sx + 2, sy); fpx(sx, sy - 2); fpx(sx, sy + 2);
      ctx.fillStyle = '#ffe14d'; fpx(sx - 1.5, sy, 4, 1); fpx(sx, sy - 1.5, 1, 4); fpx(sx - 0.5, sy, 4, 1); fpx(sx, sy - 0.5, 1, 4);
      ctx.fillStyle = '#ffffff'; fpx(sx - 0.5, sy - 0.5, 2, 2);
    }
  }

  // Frost tint on a chilled ball.
  function drawChill(b) {
    if (!b.alive || b.chill <= 0) return;
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#9fe3f5';
    for (let dy = -b.r; dy <= b.r; dy++) {
      const w = Math.floor(Math.sqrt(b.r * b.r - dy * dy));
      ctx.fillRect(Math.round(b.x - w), Math.round(b.y + dy), w * 2 + 1, 1);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + performance.now() / 900;
      ctx.fillRect(Math.round(b.x + Math.cos(a) * (b.r + 2)), Math.round(b.y + Math.sin(a) * (b.r + 2)), 1, 1);
    }
  }

  // A shimmering hex-lattice bubble around a shielded ball.
  function drawShield(b) {
    if (!b.alive || !b.shielded) return;
    const R = b.r + 4;
    const now = performance.now();
    const pulse = 0.8 + Math.sin(now / 180) * 0.2;
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#7fc8ff';
    for (let dy = -R; dy <= R; dy++) {
      const w = Math.floor(Math.sqrt(R * R - dy * dy));
      ctx.fillRect(Math.round(b.x - w), Math.round(b.y + dy), w * 2 + 1, 1);
    }
    // two hexagons, a turned inner one and an outer one, with bright corners
    const spin = now / 2000;
    for (const [rr, off, col, al] of [[R, 0, '#7fc8ff', 0.9], [R - 3, Math.PI / 6, '#7fc8ff', 0.45]]) {
      ctx.globalAlpha = pulse * al;
      const pts = [];
      for (let i = 0; i < 6; i++) { const a = spin + off + i * Math.PI / 3; pts.push([b.x + Math.cos(a) * rr, b.y + Math.sin(a) * rr]); }
      ctx.fillStyle = col;
      pts.forEach((pt, i) => pixLine(pt[0], pt[1], pts[(i + 1) % 6][0], pts[(i + 1) % 6][1]));
      ctx.fillStyle = '#ffffff';
      for (const pt of pts) ctx.fillRect(Math.round(pt[0]), Math.round(pt[1]), 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  // Jagged electric arcs in a ring around a ball.
  function drawArcs(x, y, R, count, colors) {
    for (let k = 0; k < count; k++) {
      const a0 = Math.random() * Math.PI * 2;
      let px = x + Math.cos(a0) * R, py = y + Math.sin(a0) * R;
      ctx.fillStyle = colors[k % colors.length];
      for (let s2 = 1; s2 <= 3; s2++) {
        const a = a0 + s2 * 0.22;
        const rr = R + (Math.random() - 0.5) * 5;
        const nx = x + Math.cos(a) * rr, ny = y + Math.sin(a) * rr;
        pixLine(px, py, nx, ny);
        px = nx; py = ny;
      }
    }
  }

  // A stunned ball crackles with electricity, with a countdown bar under it.
  function drawWrap(b) {
    if (!b.alive || b.stuck <= 0) return;
    drawArcs(b.x, b.y, b.r + 2, 4, ['#ffe14d', '#7fd8ff', '#ffffff']);
    // dizzy stars circling overhead
    for (let i = 0; i < 3; i++) {
      const a = performance.now() / 200 + i * Math.PI * 2 / 3;
      ctx.fillStyle = '#ffe14d';
      ctx.fillRect(Math.round(b.x + Math.cos(a) * 8), Math.round(b.y - b.r - 4 + Math.sin(a) * 2), 2, 2);
    }
    const max = 1.5;
    const w = Math.round((b.r * 2) * Math.min(1, b.stuck / max));
    ctx.fillStyle = '#0a1020'; ctx.fillRect(Math.round(b.x - b.r) - 1, Math.round(b.y + b.r + 2), b.r * 2 + 2, 3);
    ctx.fillStyle = '#7fd8ff'; ctx.fillRect(Math.round(b.x - b.r), Math.round(b.y + b.r + 3), w, 1);
  }

  // Blue electric aura around a charged shocker; sparks just before it charges.
  function drawCharge(b) {
    if (!b.alive || !b.type.shocker) return;
    if (b.charged > 0) {
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#7fd8ff';
      const R = b.r + 5;
      for (let dy = -R; dy <= R; dy++) {
        const w = Math.floor(Math.sqrt(R * R - dy * dy));
        ctx.fillRect(Math.round(b.x - w), Math.round(b.y + dy), w * 2 + 1, 1);
      }
      ctx.globalAlpha = 1;
      drawArcs(b.x, b.y, b.r + 4, 6, ['#7fd8ff', '#ffffff', '#3d8fe0']);
    } else if (b.shockT < 0.5) {
      ctx.fillStyle = '#7fd8ff';
      for (let i = 0; i < 3; i++) {
        const a = Math.random() * Math.PI * 2;
        ctx.fillRect(Math.round(b.x + Math.cos(a) * (b.r + 2)), Math.round(b.y + Math.sin(a) * (b.r + 2)), 1, 1);
      }
    }
  }

  function drawAxe(x, y, angle, alpha = 1, scale = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(snap(x), snap(y));
    ctx.rotate(angle);
    ctx.scale(scale, scale);
    ctx.drawImage(axeSprite, 0, -AXE_PIVOT_Y, AXE_W, AXE_H);   // world size; the pixels are RES x finer
    ctx.restore();
  }

  function drawWeapon(b) {
    if (b.type.gun && b.alive) drawGun(b.x, b.y, b.r, b.gunAng, b.muzzle);
    if (b.type.cap && b.alive) drawFuse(b.x, b.y, b.r, b.fuse);
    if (b.type.zap && b.alive && b.zapT < 0.6) {
      // crackling sparks while the next strike charges
      ctx.fillStyle = '#ffe14d';
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * Math.PI * 2;
        ctx.fillRect(Math.round(b.x + Math.cos(a) * (b.r + 2)), Math.round(b.y + Math.sin(a) * (b.r + 2)), 1, 1);
      }
    }
    if (b.type.studs && b.alive) drawStuds(b.x, b.y, b.r, performance.now() / 600);
    if (b.type.fangs && b.alive) drawCape(b.x, b.y, b.r, b.face);
    if (b.type.legs && b.alive) {
      const moving = b.stuck > 0 ? 0 : Math.hypot(b.vx, b.vy);
      drawLegs(b.x, b.y, b.r, performance.now() / 1000 * (4 + moving * 0.12));
    }
    if (!b.type.weapon || !b.alive) return;
    const speed = Math.abs(b.spin);
    // swoosh trail behind the blade once it gets going
    if (speed > 5) {
      const len = Math.min(2.6, speed * 0.09);
      const dir = Math.sign(b.spin);
      const reach = Math.hypot(AXE_BLADE.x + 4, AXE_BLADE.y);
      const base = b.angle + Math.atan2(AXE_BLADE.y - 3, AXE_BLADE.x + 4);
      for (let i = 0; i < 40; i++) {
        const t = i / 40;
        const a = base + dir * t * len;
        ctx.globalAlpha = (1 - t) * 0.55;
        ctx.fillStyle = speed > 14 ? '#ffd27a' : '#e8f1ff';
        for (let k = 0; k < 3; k++) {
          const rr = reach - k * 3;
          ctx.fillRect(Math.round(b.x + Math.cos(a) * rr), Math.round(b.y + Math.sin(a) * rr), 1, 1);
        }
      }
      ctx.globalAlpha = 1;
      // ghost axe a little behind the real one
      drawAxe(b.x, b.y, b.angle + Math.sign(b.spin) * Math.min(0.5, speed * 0.02), 0.25);
    }
    drawAxe(b.x, b.y, b.angle);
  }

  // A soft ground shadow under a ball, tinted toward its side's color.
  function drawShadow(b, s) {
    const cx = b.x + 1, cy = b.y + b.r - 0.5, rx = b.r * s, ry = 1.5;
    for (let j = -ry * RES; j < ry * RES; j++) {
      const dy = (j + 0.5) / RES, w = rx * Math.sqrt(Math.max(0, 1 - (dy / ry) ** 2));
      if (w <= 0) continue;
      const x0 = snap(cx - w), x1 = snap(cx + w);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x0, cy + j / RES, x1 - x0, 1 / RES);
      ctx.fillStyle = b.side === 0 ? 'rgba(255,90,90,0.18)' : 'rgba(255,210,63,0.18)'; ctx.fillRect(x0, cy + j / RES, x1 - x0, 1 / RES);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    fpx(cx - rx * 0.6, cy - 0.5 / RES, rx * 1.2 * RES, 1);   // darker core
  }

  // The side marker: a small chevron pointing down at the ball, in the side's color.
  function drawMarker(b) {
    const cx = b.x, cy = b.y - b.r - (b.type.cap ? 8 : b.type.cross ? 5 : 3.5);   // clear of a fuse or halo
    fineShape(cx, cy, 4, 0, (u, v) => v >= -1.5 && v <= 1.5 && Math.abs(u) <= 2.5 * (1.5 - v) / 3 + 0.01 ? SIDES[b.side].color : null, '#0a1020');
  }

  // HP number color: white when healthy, yellow when hurt, red when nearly done.
  function hpColor(b) {
    const pct = b.hp / b.maxHp;
    return pct > 0.5 ? '#ffffff' : pct >= 0.25 ? '#ffe14d' : '#ff6b6b';
  }

  function drawBall(b, tint) {
    if (!b.alive) return;
    let spr = spriteFor(b.type, b.r);
    if (tint) spr = tinted(spr, tint);
    const wobble = b.type.slime ? Math.sin(performance.now() / 120 + b.x * 0.1) * 0.06 : 0;   // slimes jiggle
    const s = 1 + b.squash * 1.2 + wobble;
    const k = b.r / Math.max(4, Math.round(b.r));   // the sprite is cached at a whole radius
    const w = snap(spr.size * s * k), h = snap(spr.size / s * k);
    const x = snap(b.x - w / 2), y = snap(b.y - h / 2);
    drawShadow(b, s);
    ctx.drawImage(spr, x, y, w, h);
    const now = performance.now();
    if (b.type.studs) drawStudRivets(b.x, b.y, b.r, now / 600);
    if (b.type.fangs) drawVampFace(b.x, b.y, b.r, b.face, !!b.latch);
    drawCracks(b);
    if (b.type.rng && b.rngSpin > 0) {
      // slot machine: the chip's inserts light up one after another while it rolls
      const i = Math.floor(now / 60) % 8, a = i * Math.PI / 4 + Math.PI / 8, rr = b.r * 10.1 / 12;
      ctx.fillStyle = '#ffe14d';
      fpx(b.x + Math.cos(a) * rr - 0.75, b.y + Math.sin(a) * rr - 0.75, 3, 3);
    }
    if (b.phased) {
      // wisps drifting up off a faded ghost
      ctx.fillStyle = '#e6e0f5';
      for (let i = 0; i < 3; i++) {
        const t = (now / 900 + i / 3) % 1;
        fpx(b.x + Math.sin(t * 6 + i * 2) * 3 + (i - 1) * 5, b.y + b.r - 2 - t * 12, 1, 2);
      }
    }
    drawMarker(b);
    // HP number in the middle of the ball (the WCD ball prints it dark, like a bingo ball)
    if (b.type.bingo) drawTextCentered(Math.ceil(b.hp), b.x, b.y - 2.5, '#0a1020', 1, null, true);
    else drawTextCentered(Math.ceil(b.hp), b.x, b.y - 2.5, hpColor(b), 1, '#1a2233', true);
    if (b.type.rng) drawRngBadge(b);
  }

  // The rolled number, in a little gold-trimmed box above the ball.
  function drawRngBadge(b) {
    const spinning = b.rngSpin > 0;
    const shown = spinning ? randInt(b.type.rng.min, b.type.rng.max) : b.rngValue;
    const bx = Math.round(b.x) - 7, by = Math.round(b.y - b.r) - 16;
    ctx.fillStyle = '#0a1020'; ctx.fillRect(bx - 1, by - 1, 16, 11);
    ctx.fillStyle = spinning ? '#ffffff' : '#d9a520'; ctx.fillRect(bx, by, 14, 9);
    ctx.fillStyle = spinning ? '#ffffff' : '#fff3b0'; ctx.fillRect(bx, by, 14, 1);
    ctx.fillStyle = '#1a1430'; ctx.fillRect(bx + 1, by + 1, 12, 7);
    drawTextCentered(shown, bx + 7.5, by + 2, spinning ? '#ffffff' : rngColor(shown), 1, null);
  }

  // Flash tint needs its own buffer so it only tints the ball.
  const tintBuf = document.createElement('canvas');
  const tctx = tintBuf.getContext('2d');
  function tinted(spr, color) {
    tintBuf.width = spr.width; tintBuf.height = spr.height;   // resets the context
    tctx.imageSmoothingEnabled = false;
    tctx.drawImage(spr, 0, 0);
    tctx.globalCompositeOperation = 'source-atop';
    tctx.fillStyle = color;
    tctx.fillRect(0, 0, spr.width, spr.height);
    tctx.globalCompositeOperation = 'source-over';
    tintBuf.size = spr.size;   // world size travels with the pixels
    return tintBuf;
  }
  function drawBallWithFlash(b) {
    if (!b.alive) return;
    if (b.phased) {
      // a faded ghost is see-through
      ctx.save();
      ctx.globalAlpha = 0.3 + Math.sin(performance.now() / 120) * 0.08;
      drawBall(b);
      ctx.restore();
      return;
    }
    if (b.flash > 0.12) return drawBall(b, 'rgba(255,255,255,0.9)');   // the hit frame: a white silhouette
    if (b.flash > 0) return drawBall(b, 'rgba(255,70,70,0.75)');
    if (b.type.bomb && b.fuse < 1 && Math.floor(performance.now() / 80) % 2) return drawBall(b, 'rgba(255,40,40,0.35)');
    drawBall(b);
  }

  // Each side's panel sits on a dark plate so it reads over the clouds. The plate is sized
  // from what the panel held last frame (its lines come and go).
  const panelBox = [{ w: 72, bottom: 100 }, { w: 72, bottom: 100 }];
  function drawPanel(ball, x, alignRight) {
    const side = SIDES[ball.side];
    const t = ball.type;
    const box = panelBox[ball.side], used = { w: 64, bottom: 60 };
    const text = (str, tx, ty, col) => {
      used.w = Math.max(used.w, textWidth(String(str)));
      used.bottom = Math.max(used.bottom, ty + 5);
      drawText(str, tx, ty, col);
    };
    {
      const bx0 = alignRight ? x - box.w - 4 : x - 4, bw0 = box.w + 8, by0 = 2, bh0 = box.bottom + 3 - by0;
      ctx.fillStyle = 'rgba(10,16,32,0.55)'; ctx.fillRect(bx0 + 1, by0, bw0 - 2, bh0); ctx.fillRect(bx0, by0 + 1, bw0, bh0 - 2);
      ctx.fillStyle = '#30487a';
      ctx.fillRect(bx0 + 1, by0, bw0 - 2, 1); ctx.fillRect(bx0 + 1, by0 + bh0 - 1, bw0 - 2, 1);
      ctx.fillRect(bx0, by0 + 1, 1, bh0 - 2); ctx.fillRect(bx0 + bw0 - 1, by0 + 1, 1, bh0 - 2);
    }
    text(t.name, alignRight ? x - textWidth(t.name) : x, 6, side.color);   // the title is the ball's name
    // ball icon (with its weapon)
    const ix = alignRight ? x - (t.radius * 2 + 1) : x;
    const icx = ix + t.radius + 0.5, icy = 16 + t.radius + 0.5, now = performance.now();
    if (t.weapon) drawAxe(icx, icy, alignRight ? Math.PI + 0.25 : -0.25);
    if (t.legs) drawLegs(icx, icy, t.radius, now / 250);
    if (t.studs) drawStuds(icx, icy, t.radius, now / 600);
    const iconFace = alignRight ? Math.PI : 0;
    if (t.fangs) drawCape(icx, icy, t.radius, iconFace);
    if (t.cap) drawFuse(icx, icy, t.radius, 9);
    if (t.gun) drawGun(icx, icy, t.radius, alignRight ? Math.PI : 0, 0);
    drawSprite(t.sprite, icx, icy);
    if (t.studs) drawStudRivets(icx, icy, t.radius, now / 600);
    if (t.fangs) drawVampFace(icx, icy, t.radius, iconFace, false);
    // hp bar
    const bw = 60, bx = alignRight ? x - bw : x, by = 46;
    ctx.fillStyle = '#0a1020'; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    ctx.fillStyle = '#3a2030'; ctx.fillRect(bx, by, bw, 4);
    const pct = ball.hp / ball.maxHp;
    // damage taken lingers as a red segment for a moment, then drains away (display only)
    if (ball.hpTrail === undefined || ball.hp > ball.hpTrail) ball.hpTrail = ball.hp;
    if (ball.hp !== ball.hpSeen) { ball.hpSeen = ball.hp; ball.hpHitAt = now; }
    if (now - ball.hpHitAt > 300) ball.hpTrail = Math.max(ball.hp, ball.hpTrail - ball.maxHp * 0.012);
    const fillW = Math.round(bw * pct), trailW = Math.round(bw * ball.hpTrail / ball.maxHp);
    if (trailW > fillW) { ctx.fillStyle = '#ff4f4f'; ctx.fillRect(bx + fillW, by, trailW - fillW, 4); }
    const [fillC, topC] = pct > 0.5 ? ['#5ee07a', '#a8f5b8'] : pct > 0.25 ? ['#ffd23f', '#fff3a0'] : ['#ff4f4f', '#ff9a9a'];
    ctx.fillStyle = fillC; ctx.fillRect(bx, by, fillW, 4);
    ctx.fillStyle = topC; ctx.fillRect(bx, by, fillW, 1);
    // a tank marks where its shield comes up
    if (t.shield && !ball.shielded) {
      const sx = bx + Math.round(bw * t.shield.at / ball.maxHp);
      ctx.fillStyle = '#7fc8ff'; ctx.fillRect(sx, by - 2, 1, 8);
    }
    // facing an Execute Ball: mark the kill line on this bar
    const foe = foeOf(ball) || balls.find(o => o.side !== ball.side);
    if (foe && foe.type.execute) {
      const tx = bx + Math.round(bw * foe.type.execute.below);
      ctx.fillStyle = '#d6a8ff'; ctx.fillRect(tx, by - 2, 1, 8);
    }
    const hpText = Math.ceil(ball.hp) + '/' + ball.maxHp;
    text(hpText, alignRight ? x - textWidth(hpText) : x, 53, '#cfe0ff');
    if (t.weapon) {
      const mult = 'AXE SPEED X' + (Math.abs(ball.spin) / t.weapon.spinStart).toFixed(1);
      text(mult, alignRight ? x - textWidth(mult) : x, 61, '#ffb03b');
    }
    let line = 61;
    if (t.weapon) line += 8;
    if (t.spikes) {
      const n = spikes.filter(sp => sp.owner === ball).length;
      const txt = 'SPIKES ' + n + '/' + t.spikes.max;
      text(txt, alignRight ? x - textWidth(txt) : x, line, '#e4e8ee');
      line += 8;
    }
    const info = [];
    if (t.bomb) {
      info.push(['BOOM IN ' + Math.max(0, ball.fuse).toFixed(1) + 'S', ball.fuse < 1 ? '#ff5a1f' : '#ffb03b']);
      info.push(['MINI BOMBS ' + miniBombs.filter(mb => mb.owner === ball).length + '/' + t.bomb.mini.max, '#ffb03b']);
    }
    if (t.ghost) info.push([(ball.phased ? 'FADED ' : 'SOLID ') + Math.max(0, ball.phaseT).toFixed(1) + 'S', ball.phased ? '#ffffff' : '#b9b0d6']);
    if (t.zap) info.push(['ZAP IN ' + Math.max(0, ball.zapT).toFixed(1) + 'S', '#ffe14d']);
    if (t.slime) {
      const n = balls.filter(b => b.side === ball.side && b.alive).length;
      info.push(['SLIMES ' + n + '  SPLIT ' + (ball.gen < t.slime.splitBelow.length ? 'UNDER ' + t.slime.splitBelow[ball.gen] : 'DONE'), '#c6f9a8']);
    }
    if (t.zone) info.push(['ZONES ' + zones.filter(z => z.owner === ball).length + '/' + t.zone.max + (ball.zoneStrand ? ' +DRAWING' : ''), '#ff7a7a']);
    if (ball.inZone && ball.alive) info.push(['IN A ZONE!', '#ff4f4f']);
    if (t.gun) info.push(ball.reload > 0 ? ['RELOADING ' + ball.reload.toFixed(1) + 'S', '#e8c48a'] : ['LOADED', '#ffe14d']);
    if (t.wcd && grid) info.push(['BOXES LEFT ' + grid.cells.filter(c => !c.used).length + '/25', '#9fc4ff']);
    if (t.magnet) info.push(ball.pulling ? ['PULLING - BLAST IN ' + Math.max(0, ball.magT).toFixed(1) + 'S', '#7fb2ff'] : ['PULL IN ' + Math.max(0, ball.magT).toFixed(1) + 'S', '#ff7a7a']);
    if (t.glass) info.push(['SHARDS ' + shards.filter(sh => sh.owner === ball).length + '/' + t.glass.max, '#bfeeff']);
    if (t.balloon) info.push(['SIZE ' + Math.round(ball.inflate * 100) + '%  HIT ' + baseDamagePreview(ball), '#ff8ac0']);
    if (ball.bleed > 0) info.push(['BLEEDING ' + ball.bleed.toFixed(1) + 'S', '#ff4f6d']);
    if (t.healer) info.push(['HEALS ' + heals.filter(h => h.owner === ball).length + '/' + t.healer.max, '#5ee07a']);
    if (t.chains) {
      const mine = chains.filter(c => c.owner === ball);
      info.push(['CHAINS ' + mine.length + '/' + t.chains.max + ' (' + mine.filter(c => c.target).length + ' ON)', '#c9ced6']);
      if (ball.chainT > 0) info.push(['LOCKED ' + ball.chainT.toFixed(1) + 'S', '#ffe14d']);
    }
    if (t.shocker) info.push(ball.charged > 0 ? ['CHARGED ' + ball.charged.toFixed(1) + 'S', '#ffffff'] : ['CHARGE IN ' + Math.max(0, ball.shockT).toFixed(1) + 'S', '#7fd8ff']);
    if (ball.chill > 0) info.push(['SLOWED ' + ball.chill.toFixed(1) + 'S', '#9fe3f5']);
    for (const [txt, col] of info) {
      text(txt, alignRight ? x - textWidth(txt) : x, line, col);
      line += 8;
    }
    if (t.vampire) {
      const txt = ball.latch ? 'DRAINING ' + Math.max(0, ball.latch.t).toFixed(1) + 'S'
        : ball.latchCd > 0 ? 'BITE IN ' + ball.latchCd.toFixed(1) + 'S' : 'BITE READY';
      text(txt, alignRight ? x - textWidth(txt) : x, line, ball.latch ? '#ff4f6d' : '#d9a0b4');
      line += 8;
    }
    if (t.shield) {
      const txt = ball.shielded ? 'SHIELD -' + Math.round(t.shield.reduction * 100) + '% DMG' : 'SHIELD AT ' + t.shield.at + ' HP';
      text(txt, alignRight ? x - textWidth(txt) : x, line, ball.shielded ? '#7fc8ff' : '#9fb6dc');
      line += 8;
      if (ball.shielded && t.shield.damageBoost) {
        const hit = 'HIT ' + Math.round(t.damage * (1 + t.shield.damageBoost)) + ' +' + Math.round(t.shield.damageBoost * 100) + '%';
        text(hit, alignRight ? x - textWidth(hit) : x, line, '#ff8a8a');
        line += 8;
      }
    }
    if (t.execute) {
      const txt = 'EXECUTE <' + Math.round(t.execute.below * 100) + '%';
      text(txt, alignRight ? x - textWidth(txt) : x, line, '#d6a8ff');
      line += 8;
    }
    if (t.rng) {
      const txt = ball.rngSpin > 0 ? 'ROLLING ' + ball.rngSpin.toFixed(1) + 'S' : 'NEXT HIT ' + ball.rngValue;
      text(txt, alignRight ? x - textWidth(txt) : x, line, ball.rngSpin > 0 ? '#ffffff' : rngColor(ball.rngValue));
      line += 8;
    }
    if (t.web) {
      const mine = webs ? webs.filter(wb => wb.owner === ball).length : 0;
      const webText = 'WEBS ' + mine + '/' + t.web.max + (ball.strand ? ' +SPINNING' : '');
      text(webText, alignRight ? x - textWidth(webText) : x, line, '#e6e9f2');
      line += 8;
    }
    const speed = ball.stuck > 0 ? 'STUNNED ' + ball.stuck.toFixed(1) + 'S'
      : 'SPEED X' + (Math.hypot(ball.vx, ball.vy) / ballSpeed(ball)).toFixed(1);
    text(speed, alignRight ? x - textWidth(speed) : x, line, ball.stuck > 0 ? '#ffffff' : '#9fe6ff');
    if (state === 'aim') {
      const hint = 'CLICK TO CHANGE';
      text(hint, alignRight ? x - textWidth(hint) : x, 94, '#9fb6dc');
    }
    box.w = used.w; box.bottom = used.bottom;
  }

  function drawAimArrow(me) {
    let dx = me.aimX - me.x, dy = me.aimY - me.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = dx / len, ny = dy / len;
    const power = aimPower(me);
    const start = me.r + 4, end = me.r + 10 + Math.round(power * 26);
    // each side's arrow is in its own color; it glows white while being dragged or at full power
    ctx.fillStyle = me === dragging || power > 1.2 ? '#ffffff' : SIDES[me.side].color;
    // dashed shaft
    for (let d = start; d < end - 6; d += 1) {
      if (Math.floor((d - start) / 4) % 2 === 1) continue;
      const px = Math.round(me.x + nx * d), py = Math.round(me.y + ny * d);
      ctx.fillRect(px - 1, py - 1, 2, 2);
    }
    // arrow head
    const tipX = me.x + nx * end, tipY = me.y + ny * end;
    for (let i = 0; i < 8; i++) {
      const bx = tipX - nx * i, by = tipY - ny * i;
      const half = i * 0.6;
      for (let s = -half; s <= half; s += 0.5) {
        ctx.fillRect(Math.round(bx - ny * s), Math.round(by + nx * s), 1, 1);
      }
    }
  }

  function baseDamagePreview(b) { return Math.round(lerp(...b.type.balloon.damage, b.inflate)); }

  // One short line describing a ball's special, for its card.
  function abilityText(t) {
    if (t.zone) return ['IN ZONE ' + t.zone.damage, '#ff7a7a'];
    if (t.gun) return ['GUN ' + t.gun.damage, '#ffe14d'];
    if (t.wcd) return ['BOX 1-75', '#9fc4ff'];
    if (t.magnet) return ['PULL+BLAST', '#7fb2ff'];
    if (t.glass) return ['BLEED ' + t.glass.bleedDamage, '#ff4f6d'];
    if (t.balloon) return ['INFLATES', '#ff8ac0'];
    if (t.weapon) return ['AXE ' + t.weapon.damage, '#ffb03b'];
    if (t.web) return ['WEB DMG ' + t.web.damage, '#e6e9f2'];
    if (t.shield) return ['SHLD ' + Math.round(t.shield.reduction * 100) + '%', '#7fc8ff'];
    if (t.execute) return ['KILL <' + Math.round(t.execute.below * 100) + '%', '#d6a8ff'];
    if (t.rng) return ['ROLL ' + t.rng.spinTime + 'S', '#9fb6dc'];
    if (t.spikes) return ['SPIKE ' + t.spikes.medium.damage + '-' + t.spikes.big.damage, '#e4e8ee'];
    if (t.vampire) return ['DRAIN ' + (t.vampire.drain / t.vampire.tickEvery) + '/S', '#ff4f6d'];
    if (t.bomb) return ['BOOM ' + t.bomb.damage, '#ffb03b'];
    if (t.ghost) return ['FADE ' + t.ghost.faded + 'S', '#e6e0f5'];
    if (t.zap) return ['ZAP ' + t.zap.damage + '/' + t.zap.every + 'S', '#ffe14d'];
    if (t.freeze) return ['SLOW ' + t.freeze.time + 'S', '#9fe3f5'];
    if (t.shocker) return ['STUN ' + t.shocker.stun + 'S', '#7fd8ff'];
    if (t.chains) return ['CHAIN ' + t.chains.hold + 'S', '#c9ced6'];
    if (t.slime) return ['SPLITS X2', '#c6f9a8'];
    if (t.healer) return ['HEAL ' + t.healer.heal, '#5ee07a'];
    return ['', '#ffffff'];
  }

  // Tiny 5x5 icons for the compact cards.
  const HEART_ICON = ['01010', '11111', '11111', '01110', '00100'];
  const SWORD_ICON = ['00001', '00010', '10100', '01000', '10100'];
  function drawIcon(rows, x, y, color) {
    ctx.fillStyle = color;
    rows.forEach((row, ry) => [...row].forEach((ch, rx) => { if (ch === '1') ctx.fillRect(x + rx, y + ry, 1, 1); }));
  }

  function drawSelect() {
    // the pick screen covers the whole view
    ctx.fillStyle = 'rgba(8,14,30,0.82)';
    ctx.fillRect(6, 12, W - 12, H - 18);
    ctx.fillStyle = '#30487a';
    ctx.fillRect(6, 12, W - 12, 1); ctx.fillRect(6, H - 7, W - 12, 1);
    if (selectStep === 0) {
      drawTextCentered('CHOOSE BALL 1', W / 2, 18, SIDES[0].color, 1);
      drawTextCentered('THEN CHOOSE BALL 2', W / 2, 26, '#9fb6dc', 1);
    } else {
      drawTextCentered('CHOOSE BALL 2', W / 2, 18, SIDES[1].color, 1);
      drawTextCentered('BALL 1: ' + BALL_TYPES[picks[0]].short + '   ESC: BACK', W / 2, 26, '#9fb6dc', 1);
    }
    ctx.save();
    ctx.beginPath(); ctx.rect(6, CARD_VIEW.top, W - 12, CARD_VIEW.bottom - CARD_VIEW.top); ctx.clip();
    cardRects().forEach((c, i) => {
      if (c.y + c.h < CARD_VIEW.top - 2 || c.y > CARD_VIEW.bottom + 2) return;   // off screen
      const t = BALL_TYPES[c.key];
      const hot = i === hoverCard;
      const mine = selectStep === 1 && c.key === picks[0];   // your ball, for reference
      const lift = hot ? -2 : 0;
      const y = c.y + lift;
      // card body
      ctx.fillStyle = '#0a1020'; ctx.fillRect(c.x - 1, y - 1, c.w + 2, c.h + 2);
      ctx.fillStyle = hot ? '#2f4a7a' : '#22345a'; ctx.fillRect(c.x, y, c.w, c.h);
      ctx.fillStyle = hot ? '#4f72b0' : '#30487a'; ctx.fillRect(c.x, y, c.w, 2);
      if (hot) {
        ctx.fillStyle = '#ffd23f';
        ctx.fillRect(c.x - 1, y - 1, c.w + 2, 1); ctx.fillRect(c.x - 1, y + c.h, c.w + 2, 1);
        ctx.fillRect(c.x - 1, y - 1, 1, c.h + 2); ctx.fillRect(c.x + c.w, y - 1, 1, c.h + 2);
      }
      if (mine && !hot) {
        ctx.fillStyle = SIDES[0].color;
        ctx.fillRect(c.x - 1, y - 1, c.w + 2, 1); ctx.fillRect(c.x - 1, y + c.h, c.w + 2, 1);
        ctx.fillRect(c.x - 1, y - 1, 1, c.h + 2); ctx.fillRect(c.x + c.w, y - 1, 1, c.h + 2);
      }
      if (c.key === RANDOM) {
        // a big question mark with a dice-ish wobble when hovered
        const wob = hot ? Math.round(Math.sin(performance.now() / 90) * 1.5) : 0;
        const big = c.h >= 30 ? 3 : 2;
        drawText('?', c.x + 10 + wob, y + Math.floor(c.h / 2) - Math.floor(5 * big / 2), '#ffd23f', big);
        const tx = c.x + (big === 3 ? 33 : 27), ty = y + (big === 3 ? 5 : 3);
        drawText('RANDOM', tx, ty, '#ffffff');
        drawText('ANY BALL', tx, ty + 7, '#9fb6dc');
        drawText('KEY 0', tx, ty + 14, hot ? '#ffd23f' : '#7f93b8');
        return;
      }
      // ball (with weapon) on the left; smaller on compact cards
      const compact = c.h < 30;
      const k = compact ? 0.8 : 1;
      const bob = hot && Math.floor(performance.now() / 250) % 2 ? -1 : 0;   // the hovered ball bobs
      const cx = c.x + (compact ? 13 : 16), cy = y + Math.floor(c.h / 2) + (compact ? 1 : 0) + bob;
      const rr = t.radius * k;
      ctx.save();
      ctx.beginPath(); ctx.rect(c.x, y, compact ? 26 : 32, c.h); ctx.clip();
      // a portrait well in the ball's own dark color, so the grid is color-coded
      const wr = Math.round(14 * k), wy = cy - bob;
      for (let dy = -wr; dy <= wr; dy++) {
        const ww = Math.floor(Math.sqrt(wr * wr - dy * dy));
        const wo = Math.floor(Math.sqrt(Math.max(0, (wr - 1) * (wr - 1) - dy * dy)));
        ctx.fillStyle = t.colors.rim; ctx.fillRect(cx - ww, wy + dy, ww * 2, 1);
        ctx.fillStyle = '#0a1020'; ctx.fillRect(cx - wo, wy + dy, wo * 2, 1);
        ctx.globalAlpha = 0.4; ctx.fillStyle = t.colors.dark; ctx.fillRect(cx - wo, wy + dy, wo * 2, 1); ctx.globalAlpha = 1;
      }
      if (t.weapon) {
        const ang = -Math.PI * 0.75 - (hot ? performance.now() / 300 : 0);
        drawAxe(cx, cy, ang, 1, 0.5 * k);
      }
      if (t.legs) drawLegs(cx, cy, rr, hot ? performance.now() / 120 : 0);
      if (t.studs) drawStuds(cx, cy, rr, hot ? performance.now() / 300 : 0);
      if (t.fangs) drawCape(cx, cy, rr, 0);
      if (t.cap) drawFuse(cx, cy, rr, hot ? 0.5 : 9);
      if (t.gun) drawGun(cx, cy, rr, -0.5, hot && Math.floor(performance.now() / 150) % 3 === 0 ? 1 : 0);
      drawSprite(t.sprite, cx, cy, k);
      if (t.studs) drawStudRivets(cx, cy, rr, hot ? performance.now() / 300 : 0);
      if (t.fangs) drawVampFace(cx, cy, rr, 0, hot);
      ctx.restore();
      // its number key, on a small dark tab
      const num = String(i + 1);
      ctx.fillStyle = '#0a1020'; ctx.fillRect(c.x, y, textWidth(num) + 4, 8);
      drawText(num, c.x + 2, y + 2, hot ? '#ffd23f' : '#7f93b8', 1, null);
      // stats on the right
      const hit = t.rng ? t.rng.min + '-' + t.rng.max
        : t.damageRange ? t.damageRange[0] + '-' + t.damageRange[1]
        : t.balloon ? t.balloon.damage[0] + '-' + t.balloon.damage[1] : String(t.damage);
      const [abilityTxt, abilityCol] = abilityText(t);
      if (compact) {
        // three lines: name / heart HP + sword damage / ability
        const tx = c.x + 27, ty = y + Math.max(2, Math.floor((c.h - 19) / 2));
        drawText(t.short, tx, ty, '#ffffff');
        drawIcon(HEART_ICON, tx, ty + 7, '#ff4f6d');
        drawText(String(t.hp), tx + 6, ty + 7, '#5ee07a');
        const sx = tx + 6 + textWidth(String(t.hp)) + 3;
        drawIcon(SWORD_ICON, sx, ty + 7, '#c9ced6');
        drawText(hit, sx + 6, ty + 7, t.rng ? '#ffd23f' : '#ff8a8a');
        if (abilityTxt) drawText(abilityTxt, tx, ty + 14, abilityCol);
      } else {
        const tx = c.x + 33, ty = y + Math.max(2, Math.floor((c.h - 28) / 2));
        drawText(t.short, tx, ty, '#ffffff');
        drawText('HP ' + t.hp, tx, ty + 8, '#5ee07a');
        drawText('HIT ' + hit, tx, ty + 16, t.rng ? '#ffd23f' : '#ff8a8a');
        if (abilityTxt) drawText(abilityTxt, tx, ty + 24, abilityCol);
      }
    });
    ctx.restore();
    // scrollbar, when the list is taller than the window
    if (maxScroll() > 0) {
      const trackTop = CARD_VIEW.top, trackH = CARD_VIEW.bottom - CARD_VIEW.top;
      const thumbH = Math.max(12, Math.round(trackH * trackH / cardsHeight()));
      const thumbY = trackTop + Math.round((trackH - thumbH) * scrollY / maxScroll());
      ctx.fillStyle = '#1b2a45'; ctx.fillRect(W - 9, trackTop, 2, trackH);
      ctx.fillStyle = '#9fb6dc'; ctx.fillRect(W - 9, thumbY, 2, thumbH);
      if (scrollY < maxScroll() && Math.floor(performance.now() / 400) % 2) drawTextCentered('SCROLL FOR MORE', W / 2, H - 6, '#9fb6dc', 1);
    }
  }

  function render() {
    ctx.setTransform(RES, 0, 0, RES, 0, 0);   // world units from here on (set, not scaled, so nothing compounds)
    ctx.fillStyle = '#0b1a33'; ctx.fillRect(0, 0, W, H);   // clear last frame (also under screen shake)
    ctx.save();
    if (shake > 0) {
      const m = Math.ceil(shake * 20);
      ctx.translate(Math.round((Math.random() - 0.5) * m), Math.round((Math.random() - 0.5) * m));
    }
    ctx.drawImage(bg, 0, 0);
    ctx.drawImage(arenaImg, 0, 0);

    // clip ball drawing to the arena floor
    ctx.save();
    ctx.beginPath();
    ctx.rect(PLAY.left, PLAY.top, PLAY.right - PLAY.left, PLAY.bottom - PLAY.top);
    ctx.clip();
    if (state !== 'select') { drawGrid(); drawZones(); }
    if (state === 'aim') for (const b of balls) drawAimArrow(b);
    if (state !== 'select') {
      drawWebs();
      drawSpikes();
      drawMiniBombs();
      drawChains();
      drawHeals();
      drawShards();
      drawBullets();
      for (const b of balls) { drawMagnetField(b); drawString(b); }
      for (const b of balls) drawWeapon(b);
      for (const b of balls) drawBallWithFlash(b);
      for (const b of balls) drawWrap(b);
      for (const b of balls) drawCharge(b);
      for (const b of balls) drawShield(b);
      for (const b of balls) drawChill(b);
      drawEffects();
      drawExecuteFx();
    }
    for (const p of particles) {
      // a white 1 px spark at first, then a 2 px chip of color
      const k = p.t / p.life;
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = k < 0.3 ? '#ffffff' : p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), k < 0.3 ? 1 : 2, k < 0.3 ? 1 : 2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    for (const p of popups) {
      const fade = p.t > 0.5 ? (0.8 - p.t) / 0.3 : 1;
      ctx.globalAlpha = Math.max(0, fade);
      drawTextCentered(p.text, p.x, Math.round(p.y), p.color);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // HUD (not shaken)
    if (state === 'select') drawSelect();
    else {
      drawPanel(sideBall(0), 8, false);
      drawPanel(sideBall(1), W - 8, true);
    }
    drawTextCentered(state === 'aim' ? 'DRAG A BALL TO AIM IT' : 'BALL VS BALL', W / 2, 3, '#ffffff', 1);

    if (state === 'aim') {
      const blink = Math.floor(performance.now() / 450) % 2 === 0;
      // LAUNCH button
      const bt = LAUNCH_BTN;
      ctx.fillStyle = '#0a1020'; ctx.fillRect(bt.x - 1, bt.y - 1, bt.w + 2, bt.h + 2);
      ctx.fillStyle = blink ? '#ff8a3d' : '#e8692a'; ctx.fillRect(bt.x, bt.y, bt.w, bt.h);
      ctx.fillStyle = '#ffb07a'; ctx.fillRect(bt.x, bt.y, bt.w, 1);
      drawTextCentered('LAUNCH', W / 2, bt.y + 3, '#ffffff');
    } else if (state === 'over' && roundTimer > 0.6) {   // short pause so the final hit is visible
      ctx.fillStyle = 'rgba(8,14,30,0.55)';
      ctx.fillRect(0, H / 2 - 16, W, 30);
      const msg = winner ? winner.type.name + ' WINS!' : 'DRAW!';
      const col = winner ? SIDES[winner.side].color : '#ffffff';
      drawTextCentered(msg, W / 2, H / 2 - 12, col, 3);
      if (roundTimer > 1.2) drawTextCentered('CLICK TO PICK AGAIN  -  R FOR REMATCH', W / 2, H / 2 + 7, '#cfe0ff');
    }
  }

  // ---------------------------------------------------------------------------
  // Loop
  // ---------------------------------------------------------------------------
  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  reset();
  startSelect();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
