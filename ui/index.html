<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'" />
  <title>LOL Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="chrome">
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="newtab" title="New tab (Ctrl+T)">+</button>
    </div>

    <div id="toolbar">
      <button id="back" title="Back (Alt+Left)">&#8592;</button>
      <button id="forward" title="Forward (Alt+Right)">&#8594;</button>
      <button id="reload" title="Reload (Ctrl+R)">&#8635;</button>
      <button id="home" title="Home">&#8962;</button>
      <div id="omnibox-wrap">
        <input id="omnibox" type="text" spellcheck="false"
               placeholder="Search Google or type a URL" />
        <button id="star" title="Bookmark this page (Ctrl+D)">&#9734;</button>
      </div>
      <div id="findbar" class="hidden">
        <input id="findinput" type="text" placeholder="Find in page" />
        <span id="findcount"></span>
        <button id="findprev" title="Previous">&#8593;</button>
        <button id="findnext" title="Next">&#8595;</button>
        <button id="findclose" title="Close">&#10005;</button>
      </div>
      <button id="historybtn" title="History (Ctrl+H)">&#128337;</button>
      <button id="downloadsbtn" title="Downloads (Ctrl+J)">&#8681;</button>
    </div>

    <div id="bookmarksbar"></div>
  </div>

  <div id="suggestions" class="hidden"></div>

  <div id="panel" class="hidden">
    <div id="panel-header">
      <span id="panel-title"></span>
      <button id="panel-clear" class="hidden">Clear history</button>
      <button id="panel-close">&#10005; Close</button>
    </div>
    <div id="panel-body"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
